  <a href="/docs/testing/glossary/#adapter-integration-test" target="_top"><rect x="426" y="214" width="144" height="20" rx="10" fill="#30648e"/><text x="498" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Adapter integration</text></a>
  <a href="/docs/testing/glossary/#contract-test" target="_top"><rect x="576" y="214" width="50" height="20" rx="10" fill="#6c757d"/><text x="601" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Prv.</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="632" y="214" width="48" height="20" rx="10" fill="#224968"/><text x="656" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Comp.</text></a>
  <text x="50" y="252" font-size="11" font-style="italic" fill="#556">Protocol, headers, retry on broker unavailable</text>

