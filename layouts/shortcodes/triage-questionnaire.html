<div id="triage-questionnaire" style="display:none">
  <div class="triage-breadcrumb" id="triage-breadcrumb" aria-live="polite"></div>

  <div class="triage-card" id="triage-card" role="region" aria-label="Triage questionnaire"></div>

  <div class="triage-nav">
    <button class="triage-back" id="triage-back" style="display:none" type="button">Back</button>
    <button class="triage-restart" id="triage-restart" type="button">Start over</button>
  </div>
</div>

{{- /*
  safeJS is required here. Hugo's html/template applies JavaScript context escaping
  inside <script> tags: jsonify returns a Go string value, which the template engine
  would JSON-encode again into a string literal. safeJS marks the value as trusted JS,
  bypassing that double-encoding so the browser receives valid JSON, not a quoted string.
*/ -}}
<script type="application/json" id="triage-data">{{ $data | jsonify | safeJS }}</script>

<script>
(function () {
  var dataEl = document.getElementById('triage-data');
  if (!dataEl) { return; }
  var TRIAGE_DATA = JSON.parse(dataEl.textContent);

  var questionsById = {};
  var resultsById = {};

  TRIAGE_DATA.questions.forEach(function (q) { questionsById[q.id] = q; });
  TRIAGE_DATA.results.forEach(function (r) { resultsById[r.id] = r; });

  // Dev-mode validation: warn on dangling next pointers
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    TRIAGE_DATA.questions.forEach(function (q) {
      (q.options || []).forEach(function (opt) {
        var next = opt.next;
        if (next.indexOf('result:') === 0) {
          var rid = next.slice(7);
          if (!resultsById[rid]) {
            console.warn('[triage] Dangling result pointer: "' + rid + '" in question "' + q.id + '"');
          }
        } else {
          if (!questionsById[next]) {
            console.warn('[triage] Dangling question pointer: "' + next + '" in question "' + q.id + '"');
          }
        }
      });
    });
  }

  var state = { type: 'question', id: 'start' };
  var history = [];

  function navigate(nextValue) {
    history.push({ type: state.type, id: state.id });
    if (nextValue.indexOf('result:') === 0) {
      state = { type: 'result', id: nextValue.slice(7) };
    } else {
      state = { type: 'question', id: nextValue };
    }
    window.history.replaceState(null, '', '#' + (state.type === 'result' ? 'r' : 'q') + '-' + state.id);
    renderCurrent();
  }

  function back() {
    if (history.length === 0) return;
    state = history.pop();
    window.history.replaceState(null, '', '#' + (state.type === 'result' ? 'r' : 'q') + '-' + state.id);
    renderCurrent();
  }

  function reset() {
    history = [];
    state = { type: 'question', id: 'start' };
    window.history.replaceState(null, '', window.location.pathname);
    renderCurrent();
  }

  function escape(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderCurrent() {
    var backBtn = document.getElementById('triage-back');
    var breadcrumb = document.getElementById('triage-breadcrumb');
    var card = document.getElementById('triage-card');

    backBtn.style.display = history.length > 0 ? 'inline-block' : 'none';

    if (history.length === 0) {
      breadcrumb.textContent = '';
    } else {
      breadcrumb.textContent = 'Step ' + (history.length + 1);
    }

    if (state.type === 'question') {
      renderQuestion(card, questionsById[state.id]);
    } else {
      renderResult(card, resultsById[state.id]);
    }
  }

  function renderQuestion(card, q) {
    if (!q) {
      card.innerHTML = '<p>Question not found.</p>';
      return;
    }
    var html = '<div class="triage-question">';
    if (q.context) {
      html += '<p class="triage-context">' + escape(q.context) + '</p>';
    }
    html += '<p class="triage-question-text">' + escape(q.text) + '</p>';
    html += '<div class="triage-options">';
    (q.options || []).forEach(function (opt) {
      html += '<button class="triage-option" data-next="' + escape(opt.next) + '" type="button">' + escape(opt.label) + '</button>';
    });
    html += '</div></div>';
    card.innerHTML = html;
  }

  function renderResult(card, r) {
    if (!r) {
      card.innerHTML = '<p>Result not found.</p>';
      return;
    }
    var html = '<div class="triage-result">';
    html += '<div class="triage-reframe">';
    html += '<p class="triage-reframe-label">The real problem may be:</p>';
    html += '<p class="triage-reframe-text">' + escape(r.reframe) + '</p>';
    html += '</div>';
    html += '<h3 class="triage-result-title">' + escape(r.title) + '</h3>';
    html += '<a class="triage-result-cta" href="' + escape(r.symptom_path) + '/">Read the symptom page</a>';
    if (r.also_see && r.also_see.length > 0) {
      html += '<p class="triage-also-see-label">Also see:</p><ul class="triage-also-see">';
      r.also_see.forEach(function (link) {
        html += '<li><a href="' + escape(link.path) + '/">' + escape(link.label) + '</a></li>';
      });
      html += '</ul>';
    }
    html += '</div>';
    card.innerHTML = html;
  }

  // Event delegation for option buttons
  document.getElementById('triage-card').addEventListener('click', function (e) {
    var btn = e.target.closest('.triage-option');
    if (btn) {
      navigate(btn.getAttribute('data-next'));
    }
  });

  document.getElementById('triage-back').addEventListener('click', back);
  document.getElementById('triage-restart').addEventListener('click', reset);

  // Deep link support: read hash on load
  var hash = window.location.hash;
  if (hash) {
    if (hash.indexOf('#q-') === 0) {
      var qid = hash.slice(3);
      if (questionsById[qid]) {
        state = { type: 'question', id: qid };
      }
    } else if (hash.indexOf('#r-') === 0) {
      var rid = hash.slice(3);
      if (resultsById[rid]) {
        state = { type: 'result', id: rid };
      }
    }
  }

  // Show the interactive widget and render
  document.getElementById('triage-questionnaire').style.display = 'block';
  renderCurrent();
})();
</script>
