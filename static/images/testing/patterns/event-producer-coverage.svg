  <a href="/docs/testing/glossary/#contract-test" target="_top"><rect x="528" y="350" width="98" height="20" rx="10" fill="#6c757d"/><text x="577" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Provider contract</text></a>
