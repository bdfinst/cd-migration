<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492"
     role="img" aria-labelledby="apv-title apv-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="apv-title">API Provider: layers and the tests that cover each</title>
  <desc id="apv-desc">
    Four architectural layers stacked top to bottom. The first three are inside the component boundary; the fourth (the database) is external, drawn with a dashed border. Each layer band shows its name, a one-line description, and the test types that exercise it as small coloured pills. HTTP and API surface is exercised by component tests and provider contract tests. Domain logic is exercised by solitary unit, sociable unit, and component tests. The persistence adapter is exercised by sociable unit, gateway integration, and component tests. The external database is doubled in component tests (in-memory or testcontainer) and used real in gateway integration tests.
  </desc>

  <rect width="720" height="492" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a3a">
    API Provider: Layers and the Tests That Cover Each
  </text>

  <!-- Inside boundary label -->
  <text x="40" y="56" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#224968">
    INSIDE THE COMPONENT BOUNDARY
  </text>

  <!-- Layer 1: HTTP / API surface -->
  <rect x="30" y="68" width="660" height="68" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="68" width="6" height="68" fill="#224968"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#1a2a3a">HTTP / API surface</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="464" y="78" width="80" height="20" rx="10" fill="#224968"/><text x="504" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <a href="/docs/testing/glossary/#contract-test" target="_top"><rect x="550" y="78" width="130" height="20" rx="10" fill="#6c757d"/><text x="615" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Provider contract</text></a>
  <text x="50" y="118" font-size="11" font-style="italic" fill="#556">Routing, auth, validation, status codes</text>

  <!-- Layer 2: Domain logic -->
  <rect x="30" y="144" width="660" height="68" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="144" width="6" height="68" fill="#224968"/>
  <text x="50" y="168" font-size="14" font-weight="700" fill="#1a2a3a">Domain logic</text>
  <a href="/docs/testing/glossary/#solitary-unit-test" target="_top"><rect x="380" y="154" width="104" height="20" rx="10" fill="#4a6741"/><text x="432" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Solitary unit</text></a>
  <a href="/docs/testing/glossary/#sociable-unit-test" target="_top"><rect x="490" y="154" width="104" height="20" rx="10" fill="#0d7a32"/><text x="542" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Sociable unit</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="154" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="194" font-size="11" font-style="italic" fill="#556">Business rules, invariants, state transitions</text>

  <!-- Layer 3: Persistence adapter -->
  <rect x="30" y="220" width="660" height="68" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="220" width="6" height="68" fill="#224968"/>
  <text x="50" y="244" font-size="14" font-weight="700" fill="#1a2a3a">Persistence adapter</text>
  <a href="/docs/testing/glossary/#sociable-unit-test" target="_top"><rect x="340" y="230" width="104" height="20" rx="10" fill="#0d7a32"/><text x="392" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Sociable unit</text></a>
  <a href="/docs/testing/glossary/#gateway-integration-test" target="_top"><rect x="450" y="230" width="144" height="20" rx="10" fill="#30648e"/><text x="522" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gateway integration</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="230" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="270" font-size="11" font-style="italic" fill="#556">Queries, transactions, migrations</text>

  <!-- Boundary divider -->
  <line x1="40" y1="306" x2="680" y2="306" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="302" text-anchor="middle" font-size="10" fill="#556" font-weight="600" font-style="italic">component boundary</text>

  <!-- Outside boundary label -->
  <text x="40" y="324" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#6c757d">
    OUTSIDE THE BOUNDARY
  </text>

  <!-- Layer 4: Database (external) -->
  <rect x="30" y="336" width="660" height="68" rx="6" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="30" y="336" width="6" height="68" fill="#6c757d"/>
  <text x="50" y="360" font-size="14" font-weight="700" fill="#1a2a3a">Database (external)</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="450" y="346" width="80" height="20" rx="10" fill="none" stroke="#224968" stroke-width="2"/><text x="490" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#224968">Component</text></a>
  <a href="/docs/testing/glossary/#gateway-integration-test" target="_top"><rect x="536" y="346" width="144" height="20" rx="10" fill="#30648e"/><text x="608" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gateway integration</text></a>
  <text x="50" y="386" font-size="11" font-style="italic" fill="#556">Production engine. Doubled in component tests; real in gateway integration tests.</text>

  <!-- Legend -->
  <rect x="40" y="434" width="30" height="16" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="434" width="4" height="16" fill="#224968"/>
  <text x="78" y="446" font-size="11" fill="#556">internal layer</text>
  <rect x="320" y="435" width="24" height="14" rx="7" fill="#224968"/>
  <text x="354" y="446" font-size="11" fill="#556">real code under test</text>

  <rect x="40" y="458" width="30" height="16" rx="3" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="40" y="458" width="4" height="16" fill="#6c757d"/>
  <text x="78" y="470" font-size="11" fill="#556">external (dashed border)</text>
  <rect x="320" y="459" width="24" height="14" rx="7" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="354" y="470" font-size="11" fill="#556">doubled in this test</text>

</svg>
