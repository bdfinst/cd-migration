questions:
  - id: start
    text: "What is the problem your team is most focused on right now?"
    options:
      - label: "Our tests are causing problems"
        next: testing-root
      - label: "Deploying is painful or risky"
        next: deploy-root
      - label: "Work piles up and moves slowly"
        next: flow-root
      - label: "We don't know what's happening in prod"
        next: visibility-root
      - label: "A person or team is a bottleneck"
        next: bottleneck-root
      - label: "Leadership or process is blocking us"
        next: org-root

  # Testing branch
  - id: testing-root
    context: "Let's narrow down the testing problem."
    text: "What best describes the test problem?"
    options:
      - label: "Tests pass sometimes and fail sometimes without code changes"
        next: flaky-or-env
      - label: "We have good coverage numbers but bugs still reach production"
        next: "result:high-coverage-ineffective"
      - label: "Refactoring code always breaks our tests"
        next: "result:refactoring-breaks-tests"
      - label: "The test suite is too slow"
        next: slow-tests
      - label: "We never have enough test automation"
        next: automation-lag-probe
      - label: "We need more QA capacity or faster QA sign-off"
        next: qa-capacity-probe
      - label: "We use AI to write code and quality is suffering"
        next: "result:ai-code-without-understanding"
      - label: "AI is generating technical debt faster than we can absorb it"
        next: "result:ai-accelerated-tech-debt"
      - label: "We have a legacy codebase with almost no tests"
        next: "result:legacy-no-tests"

  - id: flaky-or-env
    text: "Do the failures happen consistently across all environments, or only in some?"
    options:
      - label: "They fail in CI but pass locally, or vice versa"
        next: "result:environment-dependent-failures"
      - label: "They fail randomly regardless of environment"
        next: "result:flaky-tests"

  - id: slow-tests
    text: "Where is most of the time lost?"
    options:
      - label: "The tests themselves take a long time to execute"
        next: "result:slow-test-suites"
      - label: "Resetting the test environment or database between runs"
        next: "result:slow-test-environment-reset"
      - label: "The whole pipeline is slow, not just tests"
        next: "result:slow-pipelines"

  - id: automation-lag-probe
    context: "Before pointing you to the speed problem, let's understand the workflow."
    text: "When does test automation get written relative to the code it covers?"
    options:
      - label: "Developers write tests as part of finishing a story"
        next: "result:legacy-no-tests"
      - label: "A QA engineer writes automation after manual testing passes"
        next: "result:test-automation-lags-development"
      - label: "We write it later when we have time, which is rarely"
        next: "result:test-automation-lags-development"

  - id: qa-capacity-probe
    context: "This one is worth probing - the constraint is often structural, not capacity."
    text: "Who owns testing for a feature before it ships?"
    options:
      - label: "A separate QA team signs off before any feature goes to prod"
        next: qa-structural-probe
      - label: "The dev team owns testing but we need better tooling/skills"
        next: "result:test-automation-lags-development"

  - id: qa-structural-probe
    text: "When development finishes a feature, how long does it typically wait for QA?"
    options:
      - label: "A few hours - QA is embedded and keeps up"
        next: "result:waiting-on-qa-team"
      - label: "Days or more - QA has its own queue and sprint"
        next: "result:waiting-on-qa-team"
      - label: "We don't know - features disappear into a QA backlog"
        next: "result:waiting-on-qa-team"

  # Deployment branch
  - id: deploy-root
    text: "What is the nature of the deployment pain?"
    options:
      - label: "The team avoids or dreads deployments"
        next: fear-deploy-probe
      - label: "We need a stabilization period before each release"
        next: hardening-probe
      - label: "We need to coordinate multiple services or teams to deploy"
        next: "result:coordinated-deployments"
      - label: "We freeze merges before releases"
        next: "result:merge-freeze"
      - label: "Staging passes but production keeps failing"
        next: "result:staging-passes-production-fails"
      - label: "Every change requires approval chains before deploying"
        next: approval-probe
      - label: "We have no way to roll back a bad deploy"
        next: "result:no-rollback-capability"
      - label: "Releases depend on one specific person"
        next: "result:release-manager-bottleneck"

  - id: fear-deploy-probe
    context: "Teams often respond to deployment fear by deploying less often. Let's understand the cycle."
    text: "When deployments fail, what is the most common cause?"
    options:
      - label: "Manual steps are error-prone - someone misses something"
        next: "result:fear-of-deploying"
      - label: "Large batches of changes make it hard to know what broke"
        next: "result:fear-of-deploying"
      - label: "We deploy less often specifically to reduce risk"
        next: "result:fear-of-deploying"

  - id: hardening-probe
    context: "Needing a hardening sprint is a signal about your integration process, not just testing."
    text: "What happens during your hardening sprint?"
    options:
      - label: "Fixing bugs found during integration testing"
        next: "result:hardening-sprints"
      - label: "Manually verifying features automated tests didn't cover"
        next: "result:hardening-sprints"
      - label: "Stabilizing code that breaks when components are combined"
        next: "result:hardening-sprints"

  - id: approval-probe
    text: "Who approves changes before they can deploy?"
    options:
      - label: "A change advisory board or change management process"
        next: "result:change-management-overhead"
      - label: "A team not involved in building or testing the change"
        next: "result:waiting-for-cross-team-approval"
      - label: "Another team controls our pipeline - we can't change it"
        next: "result:pipeline-changes-require-another-team"
      - label: "We wait on a QA team sign-off"
        next: "result:waiting-on-qa-team"

  # Flow branch
  - id: flow-root
    text: "Where does the work pile up?"
    options:
      - label: "Everything is in progress but nothing is finishing"
        next: "result:too-much-wip"
      - label: "Individual work items take much longer than estimated"
        next: "result:work-items-take-too-long"
      - label: "Merging code is painful and conflict-heavy"
        next: "result:painful-merges"
      - label: "Pull requests sit for days waiting for review"
        next: "result:prs-waiting-for-review"
      - label: "Feedback from CI takes hours, not minutes"
        next: feedback-probe
      - label: "Work gets blocked and just sits idle"
        next: "result:blocked-work-sits-idle"
      - label: "Completed stories don't match what stakeholders wanted"
        next: "result:completed-work-misses-intent"
      - label: "AI tools are slowing us down instead of speeding us up"
        next: "result:ai-tooling-slowdown"
      - label: "Bug fixes take too long from discovery to resolution"
        next: "result:slow-defect-resolution"

  - id: feedback-probe
    text: "Is the pipeline itself slow, or is there no fast signal at all?"
    options:
      - label: "The pipeline runs slowly - tests, builds, or both"
        next: "result:slow-pipelines"
      - label: "There is no meaningful CI - no fast signal exists"
        next: "result:no-fast-feedback"

  # Visibility branch
  - id: visibility-root
    text: "What is the visibility problem?"
    options:
      - label: "Customers find bugs before we do"
        next: customer-finds-bugs-probe
      - label: "When alerts fire, nobody trusts them"
        next: "result:alert-fatigue"
      - label: "When something breaks, response is chaotic"
        next: "result:chaotic-incident-response"
      - label: "Code behaves differently in different environments"
        next: "result:works-on-my-machine"
      - label: "The team is exhausted and burning out"
        next: "result:team-burnout"

  - id: customer-finds-bugs-probe
    context: "There are two different visibility problems - let's find yours."
    text: "Is monitoring noisy and ignored, or missing entirely?"
    options:
      - label: "We have monitoring but it fires so often the team ignores it"
        next: "result:alert-fatigue"
      - label: "Production problems surface hours or days after they start"
        next: "result:slow-detection"
      - label: "Users report bugs our monitoring never captured at all"
        next: "result:production-issues-found-by-customers"

  # Bottleneck branch
  - id: bottleneck-root
    text: "What kind of bottleneck is it?"
    options:
      - label: "One person is required for every deployment or release"
        next: "result:release-manager-bottleneck"
      - label: "Another team controls our pipeline or infrastructure"
        next: other-team-blocks
      - label: "We are waiting on a QA team for every feature"
        next: "result:waiting-on-qa-team"
      - label: "Knowledge about our system is concentrated in one or two people"
        next: knowledge-bottleneck-probe

  - id: other-team-blocks
    text: "What does the other team control?"
    options:
      - label: "Our deployment pipeline - we can't modify it ourselves"
        next: "result:pipeline-changes-require-another-team"
      - label: "A platform team owns infrastructure we depend on and has its own queue"
        next: "result:waiting-on-platform-team"

  - id: knowledge-bottleneck-probe
    context: "Knowledge concentration looks like a people problem but it's usually a process problem."
    text: "What happens when the person with the knowledge is unavailable?"
    options:
      - label: "Work stops or slows significantly until they return"
        next: "result:rotation-ramp-up-drag"
      - label: "New team members take months to become productive"
        next: "result:rotation-ramp-up-drag"
      - label: "Only one person can review or approve certain changes"
        next: "result:rotation-ramp-up-drag"

  # Org/process branch
  - id: org-root
    text: "What is the organizational or process problem?"
    options:
      - label: "Leadership does not prioritize delivery improvement"
        next: "result:no-leadership-buy-in"
      - label: "Every change requires approval from people not involved"
        next: "result:change-management-overhead"
      - label: "We think deploying less often is safer"
        next: "result:fear-of-deploying"
      - label: "We schedule hardening sprints before releases"
        next: "result:hardening-sprints"
      - label: "We need better monitoring / observability"
        next: monitoring-probe
      - label: "We release on a monthly or quarterly schedule"
        next: "result:infrequent-releases"

  - id: monitoring-probe
    context: "Monitoring problems cluster into three types."
    text: "What is missing from your monitoring?"
    options:
      - label: "Alerts fire too often - the team ignores them"
        next: "result:alert-fatigue"
      - label: "Problems take hours or days to surface"
        next: "result:slow-detection"
      - label: "We have no idea what is normal in production"
        next: "result:production-issues-found-by-customers"

results:
  - id: test-automation-lags-development
    title: "Test Automation Always Lags Behind Development"
    reframe: >
      This is not a speed problem. Automation lags because testing is a downstream
      phase - it starts after development ends. The fix is structural: tests must be
      written as part of finishing each story, not as a follow-up activity.
    symptom_path: /docs/symptoms/testing/test-automation-lags-development
    anti_patterns:
      - path: /docs/anti-patterns/testing/testing-only-at-the-end
        label: "Testing Only at the End"
      - path: /docs/anti-patterns/testing/qa-signoff-gate
        label: "QA Sign-Off Gate"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
      - path: /docs/migrate-to-cd/brownfield/replacing-manual-validations
        label: "Replace Manual Validations"
    measures:
      - "Stories with no automation: should trend toward zero"
      - "Time from code complete to merge: falls when testing is not a separate phase"
      - "Bug escape rate: fewer defects reach QA or production"
    also_see:
      - path: /docs/symptoms/deployment/waiting-on-qa-team
        label: "Features Must Wait for a Separate QA Team"

  - id: waiting-on-qa-team
    title: "Features Must Wait for a Separate QA Team Before Shipping"
    reframe: >
      This is an architecture problem, not a capacity problem. Hiring more QA
      engineers will not fix it. A siloed QA function creates a structural handoff
      that guarantees delay. The constraint is the organizational boundary, not the
      number of people.
    symptom_path: /docs/symptoms/deployment/waiting-on-qa-team
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/siloed-qa-team
        label: "Siloed QA Team"
      - path: /docs/anti-patterns/testing/qa-signoff-gate
        label: "QA Sign-Off Gate"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
      - path: /docs/migrate-to-cd/brownfield/replacing-manual-validations
        label: "Replace Manual Validations"
    measures:
      - "Feature lead time: shrinks when QA is no longer a separate queue"
      - "Deployment frequency: increases once the QA bottleneck is removed"
      - "Test coverage per story: grows as developers own their own testing"

  - id: fear-of-deploying
    title: "The Team Is Afraid to Deploy"
    reframe: >
      Deploying less often feels safer but makes each deployment larger and riskier.
      The fear is rational, but the response - larger batches, more manual verification
      - is making the problem worse. The fix is smaller batches and automated deployment.
    symptom_path: /docs/symptoms/deployment/fear-of-deploying
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/manual-deployments
        label: "Manual Deployments"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/sprint-boundary-deployments
        label: "Deployments Tied to Sprint Boundaries"
      - path: /docs/anti-patterns/branching-integration/integration-deferred
        label: "Integration Deferred Too Long"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/pipeline-architecture
        label: "Pipeline Architecture"
      - path: /docs/migrate-to-cd/optimize/small-batches
        label: "Work in Small Batches"
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
    measures:
      - "Deployment frequency: rising toward weekly, then daily"
      - "Change failure rate: falls as smaller batches contain less risk"
      - "Team sentiment: deployments stop being treated as events requiring full-team presence"
    also_see:
      - path: /docs/symptoms/deployment/infrequent-releases
        label: "Teams That Deploy Infrequently"

  - id: hardening-sprints
    title: "Hardening Sprints Are Needed Before Every Release"
    reframe: >
      The hardening sprint is a signal that code is not continuously integrated.
      Bugs found during hardening were present throughout development but never caught
      because components were not tested together until the end. This is an integration
      problem, not a testing capacity problem.
    symptom_path: /docs/symptoms/deployment/hardening-sprints
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/hardening-sprints
        label: "Hardening Sprints Anti-Pattern"
      - path: /docs/anti-patterns/testing/testing-only-at-the-end
        label: "Testing Only at the End"
      - path: /docs/anti-patterns/branching-integration/integration-deferred
        label: "Integration Deferred Too Long"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/pipeline-test-strategy
        label: "Pipeline Test Strategy"
      - path: /docs/migrate-to-cd/brownfield/replacing-manual-validations
        label: "Replace Manual Validations"
      - path: /docs/migrate-to-cd/foundations/trunk-based-development/
        label: "Adopt Trunk-Based Development"
    measures:
      - "Hardening sprint duration: should shrink toward zero"
      - "Integration defects per release: falls as components are tested together continuously"
      - "Time from feature complete to ship: shortens when there is no stabilization phase"

  - id: alert-fatigue
    title: "The Team Ignores Alerts Because There Are Too Many"
    reframe: >
      Alert fatigue is not a volume problem you solve by adjusting thresholds. It is
      a signal that alerts are not tied to actionable, user-facing outcomes. When every
      alert requires a human judgment call about whether to act, the team stops trusting
      the system.
    symptom_path: /docs/symptoms/visibility/alert-fatigue
    anti_patterns:
      - path: /docs/anti-patterns/monitoring-observability/blind-operations
        label: "Blind Operations"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
    measures:
      - "Alert action rate: percentage of alerts that result in a human action should increase"
      - "Mean time to acknowledge: falls when alerts are trustworthy"
      - "Muted or silenced alerts: should trend toward zero"

  - id: slow-detection
    title: "Production Problems Are Discovered Hours or Days Late"
    reframe: >
      Late detection compounds damage. By the time the team learns something is broken,
      many users have been affected and the causal change is buried in subsequent work.
      This is an observability gap, not a monitoring configuration problem.
    symptom_path: /docs/symptoms/visibility/slow-detection
    anti_patterns:
      - path: /docs/anti-patterns/monitoring-observability/blind-operations
        label: "Blind Operations"
      - path: /docs/anti-patterns/pipeline/no-deployment-health-checks
        label: "No Deployment Health Checks"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
    measures:
      - "Mean time to detect: should fall from hours or days toward minutes"
      - "Customer-reported issues: fewer incidents where users find the problem before monitoring"
      - "Post-deploy anomaly detection time: should be measurable in minutes"

  - id: production-issues-found-by-customers
    title: "Production Issues Discovered by Customers"
    reframe: >
      If users find issues before your monitoring does, your observability baseline is
      wrong. This is not about adding more alerts - it is about knowing what normal
      looks like so anomalies are visible immediately.
    symptom_path: /docs/symptoms/visibility/production-issues-found-by-customers
    anti_patterns:
      - path: /docs/anti-patterns/monitoring-observability/blind-operations
        label: "Blind Operations"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
    measures:
      - "Ratio of internal to customer-detected defects: should shift heavily toward internal"
      - "Mean time to detect: falls as monitoring covers actual user-facing behavior"
      - "Support ticket volume for production bugs: decreases as detection improves"

  - id: no-leadership-buy-in
    title: "Leadership Sees CD as a Technical Nice-to-Have"
    reframe: >
      This is a framing problem. Leadership is not seeing the business cost of the
      current delivery process. The conversation needs to move from technical practices
      to delivery outcomes: lead time, change fail rate, time spent on unplanned work.
    symptom_path: /docs/symptoms/visibility/no-leadership-buy-in
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/misaligned-incentives
        label: "Misaligned Incentives"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/no-improvement-time
        label: "No Time for Improvement"
      - path: /docs/anti-patterns/organizational-cultural/planning/were-different-mindset
        label: "The 'We're Different' Mindset"
    solutions:
      - path: /docs/migrate-to-cd/assess/baseline-metrics
        label: "Establish Baseline Metrics"
      - path: /docs/migrate-to-cd/optimize/metrics-driven-improvement
        label: "Metrics-Driven Improvement"
    measures:
      - "Improvement backlog: leadership-sponsored items appear regularly"
      - "Time allocated to improvement: team has protected capacity for CD work"
      - "Delivery metrics visibility: DORA metrics are tracked and reviewed by leadership"

  - id: flaky-tests
    title: "Tests Randomly Pass or Fail"
    reframe: >
      Flaky tests are non-deterministic. The result is telling you something about
      shared state, timing dependencies, or external system coupling - not about your
      code. Reruns hide the problem; investigation reveals it.
    symptom_path: /docs/symptoms/testing/flaky-tests
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/shared-test-environments
        label: "Shared Test Environments"
      - path: /docs/anti-patterns/pipeline/no-environment-parity
        label: "No Environment Parity"
      - path: /docs/anti-patterns/testing/inverted-test-pyramid
        label: "Inverted Test Pyramid"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/deterministic-pipeline
        label: "Deterministic Pipeline"
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
    measures:
      - "Flaky test count: tracked and trending downward"
      - "Pipeline rerun rate: decreases as non-determinism is eliminated"
      - "Developer trust in the pipeline: teams stop treating failures as noise"

  - id: environment-dependent-failures
    title: "Tests Pass in One Environment but Fail in Another"
    reframe: >
      Environment-dependent failures reveal that your environments are not equivalent.
      Tests should be deterministic regardless of where they run. The fix is environment
      parity, not more reruns.
    symptom_path: /docs/symptoms/testing/environment-dependent-failures
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/no-environment-parity
        label: "No Environment Parity"
      - path: /docs/anti-patterns/pipeline/snowflake-environments
        label: "Snowflake Environments"
      - path: /docs/anti-patterns/pipeline/hardcoded-environment-assumptions
        label: "Hardcoded Environment Assumptions"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
      - path: /docs/migrate-to-cd/foundations/everything-as-code
        label: "Everything as Code"
    measures:
      - "Environment-specific failures: should approach zero as parity improves"
      - "Time spent on 'works locally, fails in CI' investigation: decreases"
      - "Environment provisioning time: shrinks as infrastructure is codified"

  - id: high-coverage-ineffective
    title: "High Coverage but Tests Miss Defects"
    reframe: >
      Coverage measures which lines execute, not whether behavior is verified. Tests
      asserting implementation details rather than outcomes will pass while real defects
      go undetected. Coverage is the wrong metric here.
    symptom_path: /docs/symptoms/testing/high-coverage-ineffective-tests
    anti_patterns:
      - path: /docs/anti-patterns/testing/code-coverage-mandates
        label: "Coverage Percentage Mandates"
      - path: /docs/anti-patterns/testing/inverted-test-pyramid
        label: "Inverted Test Pyramid"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/what-to-test
        label: "What to Test"
    measures:
      - "Defects reaching production: falls even if coverage percentage stays flat"
      - "Tests that break on refactor without behavior change: should decrease"
      - "Defect detection shift left: more bugs found in CI, fewer in production"

  - id: refactoring-breaks-tests
    title: "Refactoring Breaks Tests"
    reframe: >
      When tests are coupled to implementation rather than behavior, they fail on any
      internal change even when behavior is unchanged. This is a test design problem:
      tests should specify what the code does, not how it does it.
    symptom_path: /docs/symptoms/testing/refactoring-breaks-tests
    anti_patterns:
      - path: /docs/anti-patterns/testing/inverted-test-pyramid
        label: "Inverted Test Pyramid"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/what-to-test
        label: "What to Test"
    measures:
      - "Test failures on safe refactors: should decrease as tests target behavior"
      - "Refactoring velocity: time to complete internal changes without external behavior change"
      - "Ratio of unit to integration to e2e tests: shifting toward the base of the pyramid"

  - id: slow-test-suites
    title: "Test Suite Is Too Slow to Run"
    reframe: >
      Slow suites encourage developers to skip running them locally. Before investing
      in faster hardware or parallelization, check whether the test pyramid is inverted.
      The fix is usually test design, not infrastructure.
    symptom_path: /docs/symptoms/testing/slow-test-suites
    anti_patterns:
      - path: /docs/anti-patterns/testing/inverted-test-pyramid
        label: "Inverted Test Pyramid"
      - path: /docs/anti-patterns/testing/manual-testing-only
        label: "Manual Testing Only"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/pipeline-test-strategy
        label: "Pipeline Test Strategy"
    measures:
      - "Local test suite runtime: target under 10 minutes for developer feedback"
      - "Developer skip rate: how often the suite is not run before push"
      - "Proportion of fast unit tests: should increase as the test pyramid is corrected"

  - id: slow-test-environment-reset
    title: "Test Environments Take Too Long to Reset Between Runs"
    reframe: >
      If resetting test infrastructure dominates suite run time, your tests have an
      environment dependency problem. Tests that require real infrastructure resets are
      integration tests by nature - and they are expensive.
    symptom_path: /docs/symptoms/testing/slow-test-environment-reset
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/shared-test-environments
        label: "Shared Test Environments"
      - path: /docs/anti-patterns/pipeline/snowflake-environments
        label: "Snowflake Environments"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
      - path: /docs/migrate-to-cd/pipeline/deterministic-pipeline
        label: "Deterministic Pipeline"
    measures:
      - "Environment setup time per test run: should decrease significantly"
      - "Test isolation: tests should be runnable in any order without shared state"
      - "Infrastructure-dependent test count: fewer tests requiring full environment resets"

  - id: slow-pipelines
    title: "Pipelines Take Too Long"
    reframe: >
      A slow pipeline is a slow feedback loop. Every minute of pipeline time is a
      minute developers are context-switching and a minute defects are not yet caught.
      Pipeline optimization is a delivery throughput problem.
    symptom_path: /docs/symptoms/flow/integration/slow-pipelines
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/no-build-caching
        label: "No Build Caching"
      - path: /docs/anti-patterns/testing/inverted-test-pyramid
        label: "Inverted Test Pyramid"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/deterministic-pipeline
        label: "Deterministic Pipeline"
      - path: /docs/migrate-to-cd/pipeline/pipeline-architecture
        label: "Pipeline Architecture"
    measures:
      - "Pipeline duration: target under 10 minutes for the main feedback loop"
      - "Commit-to-feedback time: how long until a developer knows if their change is green"
      - "Context-switch rate: developers should not need to move to other work while waiting"

  - id: no-fast-feedback
    title: "Feedback Takes Hours Instead of Minutes"
    reframe: >
      Long feedback loops force developers to context-switch and let defects compound.
      If feedback takes hours, problems are always discovered after more work has been
      built on top of them.
    symptom_path: /docs/symptoms/flow/integration/no-fast-feedback
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/missing-deployment-pipeline
        label: "No Deployment Pipeline"
      - path: /docs/anti-patterns/testing/manually-triggered-tests
        label: "Manually Triggered Tests"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/pipeline-architecture
        label: "Pipeline Architecture"
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
    measures:
      - "Time from commit to first automated feedback: target under 10 minutes"
      - "Defect detection lag: how old is a bug when first found"
      - "Manual trigger frequency: every test run should be automatic on commit"

  - id: too-much-wip
    title: "Everything Started, Nothing Finished"
    reframe: >
      High WIP is not a commitment or discipline problem. It is a flow problem. When
      the team has more in-flight work than capacity to complete it, each item takes
      longer and finishing rates drop further. Reducing WIP limits is the leverage point.
    symptom_path: /docs/symptoms/flow/work-management/too-much-wip
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/unbounded-wip
        label: "Unbounded Work in Progress"
      - path: /docs/anti-patterns/team-workflow/push-based-work-assignment
        label: "Push-Based Work Assignment"
    solutions:
      - path: /docs/migrate-to-cd/optimize/limiting-wip
        label: "Limit Work in Progress"
      - path: /docs/migrate-to-cd/optimize/small-batches
        label: "Work in Small Batches"
    measures:
      - "Average WIP count: falls as limits are enforced"
      - "Cycle time: how long from start to done - should shrink"
      - "Finishing rate: items completed per sprint or week should increase"

  - id: work-items-take-too-long
    title: "Work Items Take Days or Weeks to Complete"
    reframe: >
      Items that take days or weeks to complete are usually too large to deliver safely
      and too large to estimate reliably. Work decomposition is the fix - not faster
      developers or better estimates.
    symptom_path: /docs/symptoms/flow/work-management/work-items-take-too-long
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/monolithic-work-items
        label: "Monolithic Work Items"
      - path: /docs/anti-patterns/team-workflow/big-bang-feature-delivery
        label: "Big-Bang Feature Delivery"
    solutions:
      - path: /docs/migrate-to-cd/foundations/work-decomposition
        label: "Work Decomposition"
    measures:
      - "Average story size: should trend toward one to three days to complete"
      - "Estimation accuracy: smaller items are easier to estimate correctly"
      - "Cycle time variance: high variance signals items are too large"

  - id: painful-merges
    title: "Merging Is Painful and Time-Consuming"
    reframe: >
      Painful merges are caused by integration being deferred too long. The longer
      branches diverge, the more conflicts compound. Short-lived branches integrated
      daily eliminate most merge pain.
    symptom_path: /docs/symptoms/flow/integration/painful-merges
    anti_patterns:
      - path: /docs/anti-patterns/branching-integration/long-lived-feature-branches
        label: "Long-Lived Feature Branches"
      - path: /docs/anti-patterns/branching-integration/integration-deferred
        label: "Integration Deferred Too Long"
    solutions:
      - path: /docs/migrate-to-cd/foundations/trunk-based-development/tbd-migration
        label: "Migrate to Trunk-Based Development"
      - path: /docs/migrate-to-cd/foundations/work-decomposition
        label: "Work Decomposition"
    measures:
      - "Branch lifetime: should fall toward one to two days"
      - "Merge conflict rate: decreases as integration becomes more frequent"
      - "Time spent resolving conflicts: should trend toward near-zero"

  - id: prs-waiting-for-review
    title: "Pull Requests Sit for Days Waiting for Review"
    reframe: >
      PRs that sit for days are a flow problem, not a reviewer availability problem.
      Large PRs take longer to review and get deprioritized. The fix is smaller, more
      frequent integrations - not more reviewers.
    symptom_path: /docs/symptoms/flow/integration/prs-waiting-for-review
    anti_patterns:
      - path: /docs/anti-patterns/branching-integration/long-lived-feature-branches
        label: "Long-Lived Feature Branches"
      - path: /docs/anti-patterns/team-workflow/unbounded-wip
        label: "Unbounded Work in Progress"
    solutions:
      - path: /docs/migrate-to-cd/foundations/trunk-based-development/
        label: "Adopt Trunk-Based Development"
      - path: /docs/migrate-to-cd/foundations/work-decomposition
        label: "Work Decomposition"
    measures:
      - "PR age at merge: should fall from days toward hours"
      - "PR size: smaller diffs receive faster review"
      - "Review turnaround time: time from PR open to first review comment"

  - id: blocked-work-sits-idle
    title: "Blocked Work Sits Idle Instead of Being Picked Up"
    reframe: >
      When blocked items sit rather than being reassigned or swarmed, the team is
      optimizing for individual utilization rather than flow. The goal is to finish
      work, not to keep every person busy.
    symptom_path: /docs/symptoms/flow/work-management/blocked-work-sits-idle
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/push-based-work-assignment
        label: "Push-Based Work Assignment"
      - path: /docs/anti-patterns/team-workflow/unbounded-wip
        label: "Unbounded Work in Progress"
    solutions:
      - path: /docs/migrate-to-cd/optimize/limiting-wip
        label: "Limit Work in Progress"
    measures:
      - "Blocked item age: how long items sit in a blocked state before action"
      - "Swarming rate: how often the team helps unblock vs waiting for the owner"
      - "Blocked item ratio: percentage of WIP that is blocked at any time"

  - id: completed-work-misses-intent
    title: "Completed Stories Don't Match What Was Needed"
    reframe: >
      When completed work regularly misses intent, the feedback loop between development
      and stakeholders is too long. Stakeholders see outcomes at release time, not during
      development when course-correction is cheap.
    symptom_path: /docs/symptoms/flow/work-management/completed-work-misses-intent
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/horizontal-slicing
        label: "Horizontal Slicing"
      - path: /docs/anti-patterns/team-workflow/big-bang-feature-delivery
        label: "Big-Bang Feature Delivery"
    solutions:
      - path: /docs/migrate-to-cd/foundations/work-decomposition
        label: "Work Decomposition"
      - path: /docs/migrate-to-cd/optimize/hypothesis-driven-development
        label: "Hypothesis-Driven Development"
    measures:
      - "Rework rate: percentage of completed items that require revision"
      - "Stakeholder review frequency: how often stakeholders see working software"
      - "Feedback loop length: time from start to first stakeholder validation"

  - id: works-on-my-machine
    title: "It Works on My Machine"
    reframe: >
      "Works on my machine" is an environment parity failure. Code should produce the
      same results in all environments. When it doesn't, the environment - not the
      developer's machine - is the source of truth.
    symptom_path: /docs/symptoms/visibility/works-on-my-machine
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/snowflake-environments
        label: "Snowflake Environments"
      - path: /docs/anti-patterns/pipeline/no-environment-parity
        label: "No Environment Parity"
      - path: /docs/anti-patterns/pipeline/hardcoded-environment-assumptions
        label: "Hardcoded Environment Assumptions"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
      - path: /docs/migrate-to-cd/foundations/everything-as-code
        label: "Everything as Code"
    measures:
      - "Environment-specific failure rate: should approach zero"
      - "Environment setup time: shrinks as environments are codified and reproducible"
      - "Onboarding time for new developers: falls when local setup is automated"

  - id: chaotic-incident-response
    title: "When Something Breaks, Nobody Knows What to Do"
    reframe: >
      Chaotic incidents are a runbook and ownership problem. When there are no documented
      procedures and unclear ownership, every incident is improvised. Response procedures
      and operational ownership must be established before the next incident, not during it.
    symptom_path: /docs/symptoms/visibility/chaotic-incident-response
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/no-operational-ownership
        label: "No Operational Ownership"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/blame-culture
        label: "Blame Culture"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
    measures:
      - "Mean time to restore: falls as runbooks improve response"
      - "Incident escalation rate: fewer incidents require all-hands intervention"
      - "Post-incident action completion rate: improvements are actually made"

  - id: team-burnout
    title: "Team Burnout and Unsustainable Pace"
    reframe: >
      Burnout in delivery teams is almost always caused by process overhead, not workload.
      Unplanned work, thrashing, and manual toil compound into an unsustainable cycle.
      The fix requires examining the sources of interrupt-driven work.
    symptom_path: /docs/symptoms/visibility/team-burnout
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/hero-culture
        label: "Hero Culture"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/no-improvement-time
        label: "No Time for Improvement"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/thin-spread-teams
        label: "Teams Spread Too Thin"
    solutions:
      - path: /docs/migrate-to-cd/optimize/retrospectives
        label: "Retrospectives"
      - path: /docs/migrate-to-cd/optimize/limiting-wip
        label: "Limit Work in Progress"
    measures:
      - "Unplanned work percentage: time spent on interrupt-driven work vs planned work"
      - "On-call page rate: should fall as reliability improves"
      - "Team health survey scores: tracked over time as a leading indicator"

  - id: ai-code-without-understanding
    title: "AI-Generated Code Ships Without Developer Understanding"
    reframe: >
      The risk is not AI - it is committing code nobody has verified against requirements.
      AI-generated code ships bugs and security issues when developers accept output
      without understanding what it does.
    symptom_path: /docs/symptoms/testing/ai-code-without-understanding
    anti_patterns:
      - path: /docs/anti-patterns/testing/rubber-stamping-ai-code
        label: "Rubber-Stamping AI-Generated Code"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/pressure-to-skip-testing
        label: "Pressure to Skip Testing"
    solutions:
      - path: /docs/migrate-to-cd/foundations/code-review
        label: "Code Review Practices"
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
    measures:
      - "Post-merge defect rate for AI-generated code: should match human-written code"
      - "Code review depth: reviewers should be able to explain every accepted change"
      - "Security finding rate: should not increase as AI usage grows"

  - id: legacy-no-tests
    title: "A Large Codebase Has No Automated Tests"
    reframe: >
      A legacy codebase without tests cannot be safely changed. The path forward is not
      "write all the tests first" - it is adding tests at the points of change,
      incrementally building coverage where the code is actively being modified.
    symptom_path: /docs/symptoms/testing/legacy-system-no-tests
    anti_patterns:
      - path: /docs/anti-patterns/testing/manual-testing-only
        label: "Manual Testing Only"
      - path: /docs/anti-patterns/testing/testing-only-at-the-end
        label: "Testing Only at the End"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
      - path: /docs/migrate-to-cd/brownfield/
        label: "Brownfield Migration Guide"
    measures:
      - "Automated test count in actively changed modules: growing over time"
      - "Defect rate in tested vs untested areas: tested areas should have fewer regressions"
      - "Developer confidence to change: qualitative - are teams willing to refactor?"

  - id: coordinated-deployments
    title: "Multiple Services Must Be Deployed Together"
    reframe: >
      Coordinated deployments signal architectural coupling. Services that cannot be
      deployed independently share state, data contracts, or runtime dependencies in
      ways that prevent independent delivery. This is an architecture problem, not a
      deployment process problem.
    symptom_path: /docs/symptoms/deployment/coordinated-deployments
    anti_patterns:
      - path: /docs/anti-patterns/architecture/tightly-coupled-monolith
        label: "Tightly Coupled Monolith"
      - path: /docs/anti-patterns/architecture/shared-database
        label: "Shared Database"
      - path: /docs/anti-patterns/architecture/distributed-monolith
        label: "Distributed Monolith"
    solutions:
      - path: /docs/migrate-to-cd/optimize/architecture-decoupling
        label: "Architecture Decoupling"
      - path: /docs/migrate-to-cd/pipeline/single-path-to-production
        label: "Single Path to Production"
    measures:
      - "Services that can be deployed independently: should increase over time"
      - "Coordinated release count: should fall as services decouple"
      - "Consumer contract test coverage: rises as APIs are versioned independently"

  - id: merge-freeze
    title: "Merge Freezes Before Deployments"
    reframe: >
      A merge freeze signals lack of confidence in the pipeline. If the team cannot
      merge changes up to the moment of deployment, the pipeline is not providing the
      confidence it should. Merge freezes compound batching risk.
    symptom_path: /docs/symptoms/deployment/merge-freeze
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/sprint-boundary-deployments
        label: "Deployments Tied to Sprint Boundaries"
      - path: /docs/anti-patterns/branching-integration/integration-deferred
        label: "Integration Deferred Too Long"
      - path: /docs/anti-patterns/branching-integration/long-lived-feature-branches
        label: "Long-Lived Feature Branches"
    solutions:
      - path: /docs/migrate-to-cd/foundations/trunk-based-development/
        label: "Adopt Trunk-Based Development"
      - path: /docs/migrate-to-cd/pipeline/single-path-to-production
        label: "Single Path to Production"
    measures:
      - "Merge freeze duration and frequency: should decrease toward zero"
      - "Pipeline confidence level: team's willingness to ship from main at any time"
      - "Time between merge and deploy: should shorten as trust in the pipeline grows"

  - id: staging-passes-production-fails
    title: "Staging Passes but Production Fails"
    reframe: >
      Staging is not production-like enough. Configuration differences, data volume
      mismatches, or missing dependencies mean staging catches different bugs than
      production. Environment parity is the fix.
    symptom_path: /docs/symptoms/deployment/staging-passes-production-fails
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/no-environment-parity
        label: "No Environment Parity"
      - path: /docs/anti-patterns/pipeline/snowflake-environments
        label: "Snowflake Environments"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/production-like-environments
        label: "Production-Like Environments"
      - path: /docs/migrate-to-cd/foundations/everything-as-code
        label: "Everything as Code"
    measures:
      - "Staging-to-production failure rate discrepancy: should narrow as parity improves"
      - "Bugs found only in production: should decrease"
      - "Environment configuration drift: time since last environment definition update"

  - id: change-management-overhead
    title: "Every Change Requires a Ticket and Approval Chain"
    reframe: >
      Manual approval gates between a green pipeline and production add delay without
      reducing risk - they shift risk discovery from before deployment to after it.
      The question to ask: what does this approval verify that the pipeline does not?
    symptom_path: /docs/symptoms/deployment/change-management-overhead
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/cab-gates
        label: "Change Advisory Board Gates"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/compliance-manual-approval
        label: "Manual Compliance Approvals"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/deployment-windows
        label: "Deployment Windows"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/deterministic-pipeline
        label: "Deterministic Pipeline"
      - path: /docs/migrate-to-cd/optimize/metrics-driven-improvement
        label: "Metrics-Driven Improvement"
    measures:
      - "Approval cycle time: should shrink as pipeline evidence replaces manual review"
      - "Change failure rate: should not increase as manual gates are replaced by pipeline gates"
      - "Lead time for changes: falls as approval bottlenecks are removed"

  - id: waiting-for-cross-team-approval
    title: "Work Requires Sign-Off from Teams Not Involved in Delivery"
    reframe: >
      Cross-team approvals that are not part of the build or test process create queues
      that grow over time. If the approving team is not embedded in delivery, their
      approval is theater, not verification.
    symptom_path: /docs/symptoms/deployment/waiting-for-cross-team-approval
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/separate-ops-team
        label: "Separate Operations Team"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/separation-of-duties-antipattern
        label: "Separation of Duties as a Bottleneck"
    solutions:
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
      - path: /docs/migrate-to-cd/optimize/team-alignment
        label: "Team Alignment"
    measures:
      - "Cross-team approval wait time: should shorten as collaboration patterns improve"
      - "Approvals that block deployment: count and trend over time"
      - "Cross-team review turnaround: from request to approval"

  - id: pipeline-changes-require-another-team
    title: "Teams Cannot Change Their Own Pipeline"
    reframe: >
      When a team cannot modify its own delivery process, improvement is permanently
      blocked behind another team's prioritization. Pipeline ownership must belong to
      the team delivering the software.
    symptom_path: /docs/symptoms/deployment/pipeline-changes-require-another-team
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/separate-ops-team
        label: "Separate Operations Team"
      - path: /docs/anti-patterns/pipeline/pipeline-not-versioned
        label: "Pipeline Not Version-Controlled"
    solutions:
      - path: /docs/migrate-to-cd/foundations/everything-as-code
        label: "Everything as Code"
      - path: /docs/migrate-to-cd/pipeline/pipeline-architecture
        label: "Pipeline Architecture"
    measures:
      - "Pipeline change lead time: from request to deployed - should shrink to same-day"
      - "Pipeline improvement frequency: how often teams can iterate on their pipeline"
      - "Blocked pipeline changes: count should trend toward zero"

  - id: no-rollback-capability
    title: "Deployments Are One-Way Doors"
    reframe: >
      If you cannot roll back, every deployment is high-stakes. Rollback capability
      makes deployment reversible so the cost of a bad deploy is low enough that
      deploying often becomes safe.
    symptom_path: /docs/symptoms/deployment/no-rollback-capability
    anti_patterns:
      - path: /docs/anti-patterns/pipeline/manual-deployments
        label: "Manual Deployments"
      - path: /docs/anti-patterns/pipeline/no-deployment-health-checks
        label: "No Deployment Health Checks"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/rollback
        label: "Rollback Strategy"
      - path: /docs/migrate-to-cd/continuous-deployment/progressive-rollout
        label: "Progressive Rollout"
    measures:
      - "Mean time to restore: falls when rollback is a practiced, routine operation"
      - "Deployment-triggered incidents: decreases as rollback confidence grows"
      - "Deployment frequency: can increase once rollback makes it low-risk"

  - id: release-manager-bottleneck
    title: "Releases Depend on One Person"
    reframe: >
      A release manager bottleneck signals that deployment knowledge and authority are
      concentrated in one person. Every team member should be able to deploy. When only
      one person can, their absence stops delivery.
    symptom_path: /docs/symptoms/deployment/release-manager-bottleneck
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/knowledge-silos
        label: "Knowledge Silos"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/hero-culture
        label: "Hero Culture"
    solutions:
      - path: /docs/migrate-to-cd/pipeline/single-path-to-production
        label: "Single Path to Production"
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
    measures:
      - "Number of team members who have deployed to production: should be all of them"
      - "Deployment bus factor: how many people must be unavailable to block a release"
      - "Deployment frequency variation: should not dip when the release manager is out"

  - id: ai-accelerated-tech-debt
    title: "AI Is Accelerating Technical Debt Faster Than the Team Can Absorb"
    reframe: >
      AI code generation increases velocity but it also increases the rate at which
      shortcuts, inconsistencies, and untested code accumulate. The debt is real - it
      just arrives faster than humans writing code alone. The fix requires investment
      in quality practices that scale with generation speed.
    symptom_path: /docs/symptoms/flow/developer-experience/ai-accelerated-tech-debt
    anti_patterns:
      - path: /docs/anti-patterns/testing/rubber-stamping-ai-code
        label: "Rubber-Stamping AI-Generated Code"
      - path: /docs/anti-patterns/team-workflow/undone-work
        label: "Undone Work Accumulates"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/pressure-to-skip-testing
        label: "Pressure to Skip Testing"
    solutions:
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/getting-started
        label: "Get Started with Test Automation"
      - path: /docs/migrate-to-cd/foundations/code-review
        label: "Code Review Practices"
    measures:
      - "Defect density in AI-assisted code: should match or improve over time"
      - "Technical debt items created per sprint: should not grow faster than resolution rate"
      - "Code review thoroughness: time and depth of review for AI-generated code"

  - id: ai-tooling-slowdown
    title: "AI Tools Are Slowing the Team Down"
    reframe: >
      AI tools that add friction - frequent context-switching, unreliable output,
      or poor integration with existing workflows - cost more time than they save.
      The problem is adoption without fit-assessment, not AI tooling in general.
    symptom_path: /docs/symptoms/flow/developer-experience/ai-tooling-slowdown
    solutions:
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
    measures:
      - "Developer time saved vs spent on AI tool overhead: should be net positive"
      - "Tool adoption rate: teams using AI tools by choice, not mandate"
      - "Flow state interruptions: how often AI tool friction breaks developer focus"

  - id: waiting-on-platform-team
    title: "Teams Are Blocked Waiting on a Platform Team"
    reframe: >
      When delivery teams must queue behind a platform team for every infrastructure
      change, the platform team becomes a permanent bottleneck. Self-service infrastructure
      with guardrails is the fix - not more headcount in the platform team.
    symptom_path: /docs/symptoms/flow/work-management/waiting-on-platform-team
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/separate-ops-team
        label: "Separate Operations Team"
    solutions:
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
      - path: /docs/migrate-to-cd/optimize/team-alignment
        label: "Team Alignment"
    measures:
      - "Platform request wait time: from ticket to fulfillment"
      - "Self-service infrastructure requests: percentage completed without platform team involvement"
      - "Delivery team cycle time: should not include platform queue wait time"

  - id: rotation-ramp-up-drag
    title: "Knowledge Concentration Slows the Team"
    reframe: >
      When critical knowledge lives in one person's head, the team's capacity is
      hostage to that person's availability. This is not a training problem - it is
      a documentation and pairing practice problem that compounds over time.
    symptom_path: /docs/symptoms/flow/team-knowledge/rotation-ramp-up-drag
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/knowledge-silos
        label: "Knowledge Silos"
      - path: /docs/anti-patterns/organizational-cultural/team-dynamics/no-operational-ownership
        label: "No Operational Ownership"
    solutions:
      - path: /docs/migrate-to-cd/foundations/working-agreements
        label: "Establish Working Agreements"
      - path: /docs/migrate-to-cd/foundations/everything-as-code
        label: "Everything as Code"
    measures:
      - "Ramp-up time for new team members: should fall as documentation improves"
      - "Bus factor: number of people who must be present for work to proceed"
      - "Cross-area contribution: team members working across more parts of the system"

  - id: slow-defect-resolution
    title: "Bugs Take Too Long to Fix After Discovery"
    reframe: >
      Long defect resolution time is usually a prioritization and flow problem, not
      a skill problem. If bugs queue separately from features, they age without being
      fixed. Treating defects as first-class work items is the starting point.
    symptom_path: /docs/symptoms/flow/developer-experience/slow-defect-resolution
    anti_patterns:
      - path: /docs/anti-patterns/team-workflow/push-based-work-assignment
        label: "Push-Based Work Assignment"
      - path: /docs/anti-patterns/team-workflow/undone-work
        label: "Undone Work Accumulates"
    solutions:
      - path: /docs/migrate-to-cd/optimize/limiting-wip
        label: "Limit Work in Progress"
      - path: /docs/migrate-to-cd/foundations/testing-fundamentals/defect-feedback-loop
        label: "Defect Feedback Loop"
    measures:
      - "Mean defect age at fix: time from discovery to resolution should shrink"
      - "Defect queue depth: number of open bugs should not grow faster than resolution rate"
      - "Defect escape rate: fewer bugs that were discovered late vs caught early"

  - id: infrequent-releases
    title: "Teams That Deploy Infrequently"
    reframe: >
      Low deployment frequency is both a symptom and a cause. Teams that deploy
      infrequently do so because it is hard, and it stays hard because each release
      accumulates more change. The path out is making individual releases smaller
      and more routine, not less frequent.
    symptom_path: /docs/symptoms/deployment/infrequent-releases
    anti_patterns:
      - path: /docs/anti-patterns/organizational-cultural/governance-process/sprint-boundary-deployments
        label: "Deployments Tied to Sprint Boundaries"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/deployment-windows
        label: "Deployment Windows"
      - path: /docs/anti-patterns/organizational-cultural/governance-process/release-trains
        label: "Release Trains"
    solutions:
      - path: /docs/migrate-to-cd/foundations/work-decomposition
        label: "Work Decomposition"
      - path: /docs/migrate-to-cd/optimize/small-batches
        label: "Work in Small Batches"
      - path: /docs/migrate-to-cd/pipeline/single-path-to-production
        label: "Single Path to Production"
    measures:
      - "Deployment frequency: rising from monthly toward weekly, then daily"
      - "Deployment batch size: number of changes per release - should decrease"
      - "Change failure rate: should improve or hold steady as frequency increases"
