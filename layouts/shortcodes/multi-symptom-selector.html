{{- $symptoms := (index site.Data "finder-symptoms") -}}
{{- $aps := (index site.Data "finder-antipatterns") -}}

<noscript>
<p>Enable JavaScript to use the interactive symptom selector. Without JavaScript, browse symptoms by category:</p>
<ul>
<li><a href="/docs/symptoms/deployment/">Deployment and Release</a></li>
<li><a href="/docs/symptoms/testing/">Testing</a></li>
<li><a href="/docs/symptoms/flow/">Flow and Integration</a></li>
<li><a href="/docs/symptoms/visibility/">Visibility and Monitoring</a></li>
</ul>
</noscript>

<div id="mss-container" style="display:none" aria-label="Multi-symptom selector">

  <div class="mss-persona-bar" role="group" aria-label="Filter by role">
    <span class="mss-persona-label">I am a:</span>
    <button class="mss-persona-btn mss-persona-active" data-persona="all" type="button">Everyone</button>
    <button class="mss-persona-btn" data-persona="manager" type="button">Manager</button>
    <button class="mss-persona-btn" data-persona="scrum-master" type="button">Scrum Master</button>
    <button class="mss-persona-btn" data-persona="developer" type="button">Developer</button>
  </div>

  <p class="mss-instructions">Check everything that sounds familiar. Then click <strong>Find Problems</strong>.</p>

  <div id="mss-symptom-list" role="group" aria-label="Symptom checklist"></div>

  <div class="mss-actions">
    <button id="mss-submit" type="button" class="mss-btn-primary" disabled>Find Problems</button>
    <button id="mss-reset" type="button" class="mss-btn-secondary">Clear All</button>
    <span id="mss-count" class="mss-count" aria-live="polite">0 selected</span>
  </div>

  <div id="mss-results" style="display:none" aria-live="polite"></div>

</div>

<script type="application/json" id="mss-symptoms-data">{{ $symptoms | jsonify | safeJS }}</script>
<script type="application/json" id="mss-ap-data">{{ $aps | jsonify | safeJS }}</script>

<script>
(function () {
  var symptomsEl = document.getElementById('mss-symptoms-data');
  var apEl = document.getElementById('mss-ap-data');
  if (!symptomsEl || !apEl) { return; }

  var SYMPTOMS = JSON.parse(symptomsEl.textContent);
  var AP_LIST = JSON.parse(apEl.textContent);

  var apById = {};
  AP_LIST.forEach(function (ap) { apById[ap.id] = ap; });

  var currentPersona = 'all';
  var checked = {};

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Group symptoms by category
  function groupByCategory(symptoms) {
    var order = ['deployment', 'testing', 'flow-integration', 'flow-work', 'flow-developer', 'flow-knowledge', 'visibility'];
    var groups = {};
    var labels = {};
    symptoms.forEach(function (s) {
      if (!groups[s.category]) {
        groups[s.category] = [];
        labels[s.category] = s.category_label;
      }
      groups[s.category].push(s);
    });
    var result = [];
    order.forEach(function (cat) {
      if (groups[cat]) {
        result.push({ category: cat, label: labels[cat], symptoms: groups[cat] });
      }
    });
    return result;
  }

  function renderSymptoms() {
    var list = document.getElementById('mss-symptom-list');
    var groups = groupByCategory(SYMPTOMS);
    var html = '';

    groups.forEach(function (group) {
      // Check if any symptoms in this group are visible for current persona
      var visible = group.symptoms.filter(function (s) {
        return currentPersona === 'all' || s.personas.indexOf(currentPersona) !== -1;
      });
      if (visible.length === 0) { return; }

      html += '<div class="mss-category">';
      html += '<h3 class="mss-category-title">' + esc(group.label) + '</h3>';
      html += '<div class="mss-symptom-grid">';
      visible.forEach(function (s) {
        var isChecked = checked[s.id] ? ' checked' : '';
        html += '<label class="mss-symptom-item' + isChecked + '">';
        html += '<input type="checkbox" name="symptom" value="' + esc(s.id) + '"' + isChecked + '>';
        html += '<span class="mss-symptom-text">' + esc(s.title) + '</span>';
        html += '</label>';
      });
      html += '</div></div>';
    });

    list.innerHTML = html;
    attachCheckboxListeners();
  }

  function attachCheckboxListeners() {
    var boxes = document.querySelectorAll('#mss-symptom-list input[type="checkbox"]');
    boxes.forEach(function (box) {
      box.addEventListener('change', function () {
        if (box.checked) {
          checked[box.value] = true;
          box.closest('label').classList.add('checked');
        } else {
          delete checked[box.value];
          box.closest('label').classList.remove('checked');
        }
        updateCount();
      });
    });
  }

  function updateCount() {
    var n = Object.keys(checked).length;
    var countEl = document.getElementById('mss-count');
    var submitBtn = document.getElementById('mss-submit');
    countEl.textContent = n + (n === 1 ? ' selected' : ' selected');
    submitBtn.disabled = n === 0;
    // Hide stale results when selection changes
    document.getElementById('mss-results').style.display = 'none';
  }

  function computeResults() {
    var apCount = {};
    var checkedIds = Object.keys(checked);

    checkedIds.forEach(function (sid) {
      var symptom = SYMPTOMS.find(function (s) { return s.id === sid; });
      if (!symptom) { return; }
      symptom.anti_patterns.forEach(function (apId) {
        apCount[apId] = (apCount[apId] || 0) + 1;
      });
    });

    var sorted = Object.keys(apCount).sort(function (a, b) {
      return apCount[b] - apCount[a];
    });

    return sorted.map(function (apId) {
      return { ap: apById[apId], count: apCount[apId] };
    }).filter(function (item) { return item.ap; });
  }

  function renderResults(results) {
    var el = document.getElementById('mss-results');
    var total = Object.keys(checked).length;

    if (results.length === 0) {
      el.innerHTML = '<p class="mss-no-results">No matching anti-patterns found. Try selecting more symptoms.</p>';
      el.style.display = 'block';
      return;
    }

    var html = '<div class="mss-results-header">';
    html += '<p class="mss-results-summary">Based on ' + total + ' selected symptom' + (total !== 1 ? 's' : '') + ', these practices are likely driving your problems:</p>';
    html += '</div>';
    html += '<ul class="mss-results-list">';

    results.forEach(function (item) {
      var weight = item.count >= 3 ? 'mss-result-high' : item.count === 2 ? 'mss-result-med' : 'mss-result-low';
      html += '<li class="mss-result-item ' + weight + '">';
      html += '<a href="' + esc(item.ap.path) + '" class="mss-result-link">' + esc(item.ap.title) + '</a>';
      html += '<span class="mss-result-count">' + item.count + ' symptom' + (item.count !== 1 ? 's' : '') + '</span>';
      html += '</li>';
    });

    html += '</ul>';
    html += '<p class="mss-results-note">Higher counts indicate stronger signal. Start with the top anti-patterns.</p>';

    el.innerHTML = html;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Persona tabs
  document.getElementById('mss-container').addEventListener('click', function (e) {
    var btn = e.target.closest('.mss-persona-btn');
    if (btn) {
      currentPersona = btn.getAttribute('data-persona');
      document.querySelectorAll('.mss-persona-btn').forEach(function (b) {
        b.classList.toggle('mss-persona-active', b === btn);
      });
      checked = {};
      updateCount();
      renderSymptoms();
      document.getElementById('mss-results').style.display = 'none';
    }
  });

  // Submit
  document.getElementById('mss-submit').addEventListener('click', function () {
    var results = computeResults();
    renderResults(results);
  });

  // Reset
  document.getElementById('mss-reset').addEventListener('click', function () {
    checked = {};
    updateCount();
    renderSymptoms();
    document.getElementById('mss-results').style.display = 'none';
  });

  // Init
  document.getElementById('mss-container').style.display = 'block';
  renderSymptoms();
  updateCount();
})();
</script>
