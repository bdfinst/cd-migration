name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read tool versions from netlify.toml
        run: |
          echo "HUGO_VERSION=$(grep -oP '^\s*HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)" >> $GITHUB_ENV
          echo "NODE_VERSION=$(grep -oP '^\s*NODE_VERSION\s*=\s*"\K[^"]+' netlify.toml)" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep -oP '^\s*GO_VERSION\s*=\s*"\K[^"]+' netlify.toml)" >> $GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Hugo
        run: |
          v="$HUGO_VERSION"; [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]] && v="$v.0"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${v}/hugo_extended_${v}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${v}_linux-amd64.deb"

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Check links
        run: npx linkinator --recurse public/ --config ./linkinator.config.json
