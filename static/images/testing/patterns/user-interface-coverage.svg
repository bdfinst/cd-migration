<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 532"
     role="img" aria-labelledby="uic-title uic-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="uic-title">User Interface: layers and the tests that cover each</title>
  <desc id="uic-desc">
    Five architectural layers stacked top to bottom. The first four (pure rendering, component composition, feature behaviour in the rendered DOM, and backend HTTP client) are inside the component boundary. Below the dashed component boundary, the external backend API is drawn with a dashed border. Each band shows its name, a one-line description, and the test types that exercise it as small coloured pills. Solitary unit tests cover pure rendering. Sociable unit tests cover composition. Component tests driven by Playwright with the team's unit-testing framework cover feature behaviour with the backend stubbed at the network layer. Consumer contract tests pin each backend boundary. End-to-end tests run post-deploy in a real browser against the real backend.
  </desc>

  <rect width="720" height="532" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a3a">
    User Interface: Layers and the Tests That Cover Each
  </text>

  <!-- Inside boundary label -->
  <text x="40" y="56" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#224968">
    INSIDE THE COMPONENT BOUNDARY
  </text>

  <!-- Layer 1: Pure rendering -->
  <rect x="30" y="68" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="68" width="6" height="60" fill="#224968"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#1a2a3a">Pure rendering</text>
  <a href="/docs/testing/glossary/#solitary-unit-test" target="_top"><rect x="488" y="78" width="104" height="20" rx="10" fill="#4a6741"/><text x="540" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Solitary unit</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="78" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="116" font-size="11" font-style="italic" fill="#556">A component renders given props or state</text>

  <!-- Layer 2: Component composition -->
  <rect x="30" y="136" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="136" width="6" height="60" fill="#224968"/>
  <text x="50" y="160" font-size="14" font-weight="700" fill="#1a2a3a">Component composition</text>
  <a href="/docs/testing/glossary/#sociable-unit-test" target="_top"><rect x="488" y="146" width="104" height="20" rx="10" fill="#0d7a32"/><text x="540" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Sociable unit</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="146" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="184" font-size="11" font-style="italic" fill="#556">Composed components wire correctly</text>

  <!-- Layer 3: Feature behaviour in the DOM -->
  <rect x="30" y="204" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="204" width="6" height="60" fill="#224968"/>
  <text x="50" y="228" font-size="14" font-weight="700" fill="#1a2a3a">Feature behaviour in the rendered DOM</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="214" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="252" font-size="11" font-style="italic" fill="#556">Flows, form validation, a11y assertions, error UX (Playwright + unit-test framework)</text>

  <!-- Layer 4: Backend HTTP client -->
  <rect x="30" y="272" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="272" width="6" height="60" fill="#224968"/>
  <text x="50" y="296" font-size="14" font-weight="700" fill="#1a2a3a">Backend HTTP client</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="448" y="282" width="80" height="20" rx="10" fill="#224968"/><text x="488" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <a href="/docs/testing/glossary/#contract-test" target="_top"><rect x="534" y="282" width="146" height="20" rx="10" fill="#6c757d"/><text x="607" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Consumer contract</text></a>
  <text x="50" y="320" font-size="11" font-style="italic" fill="#556">Fetch / request build, response parse, retry, auth headers</text>

  <!-- Boundary divider -->
  <line x1="40" y1="354" x2="680" y2="354" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="350" text-anchor="middle" font-size="10" fill="#556" font-weight="600" font-style="italic">component boundary</text>

  <!-- Outside boundary label -->
  <text x="40" y="372" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#6c757d">
    OUTSIDE THE BOUNDARY
  </text>

  <!-- Layer 5: Backend API (external) -->
  <rect x="30" y="384" width="660" height="80" rx="6" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="30" y="384" width="6" height="80" fill="#6c757d"/>
  <text x="50" y="408" font-size="14" font-weight="700" fill="#1a2a3a">Backend API (external)</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="490" y="418" width="80" height="20" rx="10" fill="none" stroke="#224968" stroke-width="2"/><text x="530" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#224968">Component</text></a>
  <a href="/docs/testing/test-types/e2e/" target="_top"><rect x="606" y="418" width="74" height="20" rx="10" fill="#6c757d"/><text x="643" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">E2E</text></a>
  <text x="50" y="450" font-size="11" font-style="italic" fill="#556">Stubbed via page.route in component tests; real in E2E smoke.</text>

  <!-- Legend -->
  <rect x="40" y="494" width="30" height="16" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="494" width="4" height="16" fill="#224968"/>
  <text x="78" y="506" font-size="11" fill="#556">internal layer</text>
  <rect x="320" y="495" width="24" height="14" rx="7" fill="#224968"/>
  <text x="354" y="506" font-size="11" fill="#556">real code under test</text>

  <rect x="40" y="518" width="30" height="16" rx="3" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="40" y="518" width="4" height="16" fill="#6c757d"/>
  <text x="78" y="530" font-size="11" fill="#556">external (dashed border)</text>
  <rect x="320" y="519" width="24" height="14" rx="7" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="354" y="530" font-size="11" fill="#556">doubled in this test</text>

</svg>
