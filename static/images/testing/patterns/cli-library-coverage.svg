<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     role="img" aria-labelledby="clc-title clc-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="clc-title">CLI Tool or Library: layers tested by each test type</title>
  <desc id="clc-desc">
    A coverage matrix for the CLI tool or library pattern. Rows are the architectural layers: pure logic and parsing, the CLI invocation surface (argv, stdin, stdout, stderr, exit code) or the library's exported API, the file system and subprocess gateway, the documented examples in the README, and the real OS file system and subprocess. Columns are the test types: solitary unit, component (in-band, through the CLI entrypoint or library API), gateway integration, API surface diff, doctests, and a cross-platform CI matrix. Filled dots mark layers exercised by real code; outlined dots mark doubled layers. Solitary unit tests cover pure logic and parsing. Component tests cover CLI invocation through the entrypoint. Gateway integration tests cover the file system and subprocess against the real OS in a temp directory. The API surface diff catches removal or rename of any public symbol. Doctests verify the README examples actually work. The cross-platform matrix runs the suite on every supported OS.
  </desc>

  <rect width="760" height="420" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a3a">
    CLI Tool or Library: Layers Tested by Each Test Type
  </text>

  <!-- Column headers -->
  <text x="105" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2a3a">Layer</text>

  <rect x="180" y="56" width="92" height="36" rx="4" fill="#4a6741" stroke="#3a5331"/>
  <text x="226" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Solitary</text>
  <text x="226" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Unit</text>

  <rect x="274" y="56" width="92" height="36" rx="4" fill="#224968" stroke="#1a3a54"/>
  <text x="320" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Component</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(invocation)</text>

  <rect x="368" y="56" width="92" height="36" rx="4" fill="#30648e" stroke="#224968"/>
  <text x="414" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Gateway</text>
  <text x="414" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Integration</text>

  <rect x="462" y="56" width="92" height="36" rx="4" fill="#6c757d" stroke="#565e64"/>
  <text x="508" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">API Surface</text>
  <text x="508" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Diff</text>

  <rect x="556" y="56" width="92" height="36" rx="4" fill="#6c757d" stroke="#565e64"/>
  <text x="602" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Doctests</text>
  <text x="602" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(examples)</text>

  <rect x="650" y="56" width="92" height="36" rx="4" fill="#224968" stroke="#1a3a54"/>
  <text x="696" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Cross-OS</text>
  <text x="696" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">CI matrix</text>

  <!-- Row 1: Pure logic / parsing -->
  <rect x="30" y="104" width="712" height="44" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="123" font-size="12" font-weight="600" fill="#1a2a3a">Pure logic and parsing</text>
  <text x="40" y="139" font-size="10" fill="#556">functions, classes, parsers; no I/O</text>
  <circle cx="226" cy="126" r="9" fill="#4a6741"/>
  <circle cx="320" cy="126" r="9" fill="#224968"/>

  <!-- Row 2: CLI invocation / library API -->
  <rect x="30" y="148" width="712" height="44" fill="#edf2f7" stroke="#e5e7eb"/>
  <text x="40" y="167" font-size="12" font-weight="600" fill="#1a2a3a">CLI invocation surface or library API</text>
  <text x="40" y="183" font-size="10" fill="#556">argv, stdin, stdout, stderr, exit code, --help, exported symbols</text>
  <circle cx="320" cy="170" r="9" fill="#224968"/>
  <circle cx="508" cy="170" r="9" fill="#6c757d"/>
  <circle cx="602" cy="170" r="9" fill="#6c757d"/>
  <circle cx="696" cy="170" r="9" fill="#224968"/>

  <!-- Row 3: FS / subprocess gateway -->
  <rect x="30" y="192" width="712" height="44" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="211" font-size="12" font-weight="600" fill="#1a2a3a">File system and subprocess gateway</text>
  <text x="40" y="227" font-size="10" fill="#556">paths, encodings, signal handling, spawn semantics</text>
  <circle cx="320" cy="214" r="9" fill="#224968"/>
  <circle cx="414" cy="214" r="9" fill="#30648e"/>
  <circle cx="696" cy="214" r="9" fill="#224968"/>

  <!-- Row 4: README examples -->
  <rect x="30" y="236" width="712" height="44" fill="#edf2f7" stroke="#e5e7eb"/>
  <text x="40" y="255" font-size="12" font-weight="600" fill="#1a2a3a">Documented README examples</text>
  <text x="40" y="271" font-size="10" fill="#556">examples in the docs actually run against the real binary or library</text>
  <circle cx="602" cy="258" r="9" fill="#6c757d"/>

  <!-- Row 5: Real OS / FS / subprocess -->
  <rect x="30" y="280" width="712" height="44" fill="#ffffff" stroke="#e5e7eb" stroke-dasharray="5,3"/>
  <text x="40" y="299" font-size="12" font-weight="600" fill="#1a2a3a">Real OS, file system, subprocess</text>
  <text x="40" y="315" font-size="10" fill="#556">path separators, line endings, signals; doubled in component, real in gateway</text>
  <circle cx="320" cy="302" r="9" fill="none" stroke="#224968" stroke-width="2"/>
  <circle cx="414" cy="302" r="9" fill="#30648e"/>
  <circle cx="696" cy="302" r="9" fill="#224968"/>

  <!-- Legend -->
  <circle cx="44" cy="356" r="8" fill="#224968"/>
  <text x="58" y="360" font-size="11" fill="#556">Real code under test</text>
  <circle cx="206" cy="356" r="8" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="220" y="360" font-size="11" fill="#556">Doubled in this test</text>
  <text x="370" y="360" font-size="11" fill="#556">Empty cell: layer not exercised by that test type</text>
  <text x="44" y="392" font-size="10" fill="#556" font-style="italic">
    The cross-OS matrix is not a test type so much as where the same suite runs; it catches platform-specific path, encoding, and signal-handling bugs.
  </text>
</svg>
