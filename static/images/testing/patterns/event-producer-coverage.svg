  <rect x="40" y="528" width="4" height="16" fill="#6c757d"/>
  <text x="78" y="540" font-size="11" fill="#556">external (dashed border)</text>
  <rect x="320" y="529" width="24" height="14" rx="7" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="354" y="540" font-size="11" fill="#556">doubled in this test</text>

