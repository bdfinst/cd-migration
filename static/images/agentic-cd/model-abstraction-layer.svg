<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img" aria-labelledby="mal-title mal-desc">
  <title id="mal-title">Model-Agnostic Abstraction Layer Architecture</title>
  <desc id="mal-desc">A three-tier layered architecture diagram. Top tier: Orchestration Layer box labeled "calls invoke() only, no model-specific code". Middle tier: ModelClient interface box labeled "invoke(context) returns output and usage". A dashed horizontal line separates the middle tier from the bottom tier, labeled "abstraction boundary". Bottom tier: two side-by-side boxes, ClaudeClient (blue) and GeminiClient (green), each with their API field name differences noted. Below each client: API boxes labeled Claude Messages API and Gemini generateContent API.</desc>

  <!-- Background -->
  <rect width="620" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#555"/>
    </marker>
    <marker id="arr-down-dashed" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Tier 1: Orchestration Layer -->
  <rect x="110" y="20" width="400" height="80" rx="6" ry="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="310" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Orchestration Layer</text>
  <text x="310" y="73" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">calls invoke() only</text>
  <text x="310" y="88" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">no model-specific code</text>

  <!-- Arrow: Orchestration -> ModelClient (dashed, labeled) -->
  <line x1="310" y1="100" x2="310" y2="148" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-down-dashed)"/>
  <text x="355" y="128" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">abstraction</text>
  <text x="355" y="141" font-family="Arial, sans-serif" font-size="10" fill="#555" text-anchor="start">boundary</text>

  <!-- Tier 2: ModelClient interface -->
  <rect x="110" y="148" width="400" height="80" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="310" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ModelClient interface</text>
  <text x="310" y="202" font-family="Arial, monospace, monospace" font-size="11" fill="#dce4ff" text-anchor="middle">invoke(context)</text>
  <text x="310" y="218" font-family="Arial, monospace, monospace" font-size="11" fill="#dce4ff" text-anchor="middle">-> &#123; output, usage &#125;</text>

  <!-- Dashed horizontal abstraction boundary line -->
  <line x1="60" y1="252" x2="560" y2="252" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="570" y="256" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="start">boundary</text>

  <!-- Arrow: ModelClient -> ClaudeClient -->
  <line x1="225" y1="228" x2="185" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- Arrow: ModelClient -> GeminiClient -->
  <line x1="395" y1="228" x2="435" y2="288" stroke="#555" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- Tier 3 Left: ClaudeClient -->
  <rect x="60" y="288" width="220" height="90" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="170" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ClaudeClient</text>
  <text x="170" y="336" font-family="Arial, monospace, monospace" font-size="9.5" fill="#dce4ff" text-anchor="middle">system: context.systemPrompt</text>
  <text x="170" y="352" font-family="Arial, monospace, monospace" font-size="9.5" fill="#dce4ff" text-anchor="middle">usage.input_tokens</text>
  <text x="170" y="368" font-family="Arial, monospace, monospace" font-size="9.5" fill="#dce4ff" text-anchor="middle">usage.output_tokens</text>

  <!-- Tier 3 Right: GeminiClient -->
  <rect x="340" y="288" width="220" height="90" rx="6" ry="6" fill="#34A853" stroke="#2a8f45" stroke-width="1.5"/>
  <text x="450" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">GeminiClient</text>
  <text x="450" y="336" font-family="Arial, monospace, monospace" font-size="9.5" fill="#d0f0db" text-anchor="middle">systemInstruction</text>
  <text x="450" y="352" font-family="Arial, monospace, monospace" font-size="9.5" fill="#d0f0db" text-anchor="middle">usageMetadata</text>
  <text x="450" y="368" font-family="Arial, monospace, monospace" font-size="9.5" fill="#d0f0db" text-anchor="middle">.promptTokenCount</text>

  <!-- Arrow: ClaudeClient -> Claude API -->
  <line x1="170" y1="378" x2="170" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- Arrow: GeminiClient -> Gemini API -->
  <line x1="450" y1="378" x2="450" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arr-down)"/>

  <!-- API box: Claude Messages API -->
  <rect x="60" y="420" width="220" height="52" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="170" y="443" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Claude Messages API</text>
  <text x="170" y="462" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">anthropic.com</text>

  <!-- API box: Gemini generateContent API -->
  <rect x="340" y="420" width="220" height="52" rx="6" ry="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="450" y="443" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Gemini generateContent</text>
  <text x="450" y="462" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">googleapis.com</text>

</svg>
