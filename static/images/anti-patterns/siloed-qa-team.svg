<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"
     role="img" aria-labelledby="sqa-title sqa-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="sqa-title">Siloed QA Team: Anti-Pattern vs Integrated Approach</title>
  <desc id="sqa-desc">
    Before (left, anti-pattern): Dev codes story, then hands off to a separate QA team, who perform
    manual testing, then send bug reports back to the developer. This is a sequential, siloed process.
    After (right, integrated approach): Dev and QA collaborate during development, automated tests are
    written together, and quality becomes a shared practice owned by the whole team.
  </desc>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="4"/>

  <defs>
    <marker id="sqa-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#224968"/>
    </marker>
    <marker id="sqa-arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a63123"/>
    </marker>
  </defs>

  <!-- Diagram title -->
  <text x="360" y="30" text-anchor="middle" font-size="17"
        font-weight="bold" fill="#1a2a3a">Siloed QA Team</text>

  <!-- Panel labels -->
  <text x="178" y="54" text-anchor="middle" font-size="12"
        font-weight="700" fill="#a63123">Anti-Pattern</text>
  <text x="542" y="54" text-anchor="middle" font-size="12"
        font-weight="700" fill="#0d7a32">Integrated Approach</text>

  <!-- Divider -->
  <line x1="360" y1="60" x2="360" y2="370" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- BEFORE: four sequential steps, top to bottom, red -->

  <!-- Step 1: Dev codes story -->
  <rect x="93" y="72" width="170" height="44" rx="4"
        fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="178" y="98" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Dev codes story</text>

  <!-- Arrow -->
  <line x1="178" y1="116" x2="178" y2="142"
        stroke="#a63123" stroke-width="2" marker-end="url(#sqa-arr-r)"/>

  <!-- Step 2: Handoff to QA -->
  <rect x="93" y="142" width="170" height="44" rx="4"
        fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="178" y="168" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Handoff to QA</text>

  <!-- Arrow -->
  <line x1="178" y1="186" x2="178" y2="212"
        stroke="#a63123" stroke-width="2" marker-end="url(#sqa-arr-r)"/>

  <!-- Step 3: Manual testing -->
  <rect x="93" y="212" width="170" height="44" rx="4"
        fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="178" y="238" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Manual testing</text>

  <!-- Arrow -->
  <line x1="178" y1="256" x2="178" y2="282"
        stroke="#a63123" stroke-width="2" marker-end="url(#sqa-arr-r)"/>

  <!-- Step 4: Bug report back to dev (two lines) -->
  <rect x="93" y="282" width="170" height="48" rx="4"
        fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="178" y="302" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Bug report</text>
  <text x="178" y="320" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">back to dev</text>

  <!-- AFTER: three integrated steps, top to bottom -->

  <!-- Step 1: Dev + QA collaborate (two lines, navy) -->
  <rect x="457" y="72" width="170" height="48" rx="4"
        fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="542" y="92" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Dev + QA</text>
  <text x="542" y="110" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">collaborate</text>

  <!-- Arrow -->
  <line x1="542" y1="120" x2="542" y2="148"
        stroke="#224968" stroke-width="2" marker-end="url(#sqa-arr)"/>

  <!-- Step 2: Automated tests written together (two lines, navy) -->
  <rect x="457" y="148" width="170" height="48" rx="4"
        fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="542" y="168" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Automated tests</text>
  <text x="542" y="186" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">written together</text>

  <!-- Arrow -->
  <line x1="542" y1="196" x2="542" y2="224"
        stroke="#224968" stroke-width="2" marker-end="url(#sqa-arr)"/>

  <!-- Step 3: Quality is shared practice (two lines, green) -->
  <rect x="457" y="224" width="170" height="48" rx="4"
        fill="#0d7a32" stroke="#0a6128" stroke-width="1"/>
  <text x="542" y="244" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">Quality is a</text>
  <text x="542" y="262" text-anchor="middle" font-size="13"
        font-weight="600" fill="#fff">shared practice</text>

  <!-- Legend -->
  <rect x="30" y="384" width="12" height="12" rx="2"
        fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="46" y="394" font-size="11" fill="#556">Anti-pattern state</text>

  <rect x="180" y="384" width="12" height="12" rx="2"
        fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="196" y="394" font-size="11" fill="#556">Integrated development</text>

  <rect x="360" y="384" width="12" height="12" rx="2"
        fill="#0d7a32" stroke="#0a6128" stroke-width="1"/>
  <text x="376" y="394" font-size="11" fill="#556">Positive outcome</text>

</svg>
