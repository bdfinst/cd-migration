<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     role="img" aria-labelledby="sjc-title sjc-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="sjc-title">Scheduled Job: layers tested by each test type</title>
  <desc id="sjc-desc">
    A coverage matrix for the scheduled job pattern. Rows are the architectural layers: pure transformation logic, job orchestration (idempotency, locking, time windows, checkpointing), source and sink gateways, process startup, the external scheduler, and the external source and sink data systems. Columns are the test types: solitary unit, component (in-band, with an injected clock and source and sink doubles), gateway integration, source and sink contract, deployed-binary tests, and out-of-band integration checks. Filled dots mark layers exercised by real code; outlined dots mark doubled layers. Solitary unit tests cover pure transformation logic. Component tests cover orchestration with the clock and gateways doubled. Gateway integration tests exercise the source and sink gateways against real source and sink containers. Deployed-binary tests cover process startup, configuration loading, and exit code handling on the actual artifact the scheduler will invoke. The out-of-band check is what catches scheduler typos, secret resolution failures, and time-zone mismatches between the test clock and production wiring.
  </desc>

  <rect width="760" height="470" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a3a">
    Scheduled Job: Layers Tested by Each Test Type
  </text>

  <!-- Column headers -->
  <text x="105" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2a3a">Layer</text>

  <rect x="180" y="56" width="92" height="36" rx="4" fill="#4a6741" stroke="#3a5331"/>
  <text x="226" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Solitary</text>
  <text x="226" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Unit</text>

  <rect x="274" y="56" width="92" height="36" rx="4" fill="#224968" stroke="#1a3a54"/>
  <text x="320" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Component</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(in-band)</text>

  <rect x="368" y="56" width="92" height="36" rx="4" fill="#30648e" stroke="#224968"/>
  <text x="414" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Gateway</text>
  <text x="414" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Integration</text>

  <rect x="462" y="56" width="92" height="36" rx="4" fill="#6c757d" stroke="#565e64"/>
  <text x="508" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Source / Sink</text>
  <text x="508" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Contract</text>

  <rect x="556" y="56" width="92" height="36" rx="4" fill="#224968" stroke="#1a3a54"/>
  <text x="602" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Deployed</text>
  <text x="602" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Binary</text>

  <rect x="650" y="56" width="92" height="36" rx="4" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="696" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#556">Integration</text>
  <text x="696" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#556">(out-of-band)</text>

  <!-- Row 1: Pure transformation -->
  <rect x="30" y="104" width="712" height="44" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="123" font-size="12" font-weight="600" fill="#1a2a3a">Pure transformation logic</text>
  <text x="40" y="139" font-size="10" fill="#556">the data calculation; no I/O</text>
  <circle cx="226" cy="126" r="9" fill="#4a6741"/>
  <circle cx="320" cy="126" r="9" fill="#224968"/>

  <!-- Row 2: Job orchestration -->
  <rect x="30" y="148" width="712" height="44" fill="#edf2f7" stroke="#e5e7eb"/>
  <text x="40" y="167" font-size="12" font-weight="600" fill="#1a2a3a">Job orchestration</text>
  <text x="40" y="183" font-size="10" fill="#556">idempotency, locking, time windows, checkpointing (injected clock)</text>
  <circle cx="320" cy="170" r="9" fill="#224968"/>

  <!-- Row 3: Source / sink gateways -->
  <rect x="30" y="192" width="712" height="44" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="211" font-size="12" font-weight="600" fill="#1a2a3a">Source and sink gateways</text>
  <text x="40" y="227" font-size="10" fill="#556">protocol, error mapping, transactional semantics</text>
  <circle cx="320" cy="214" r="9" fill="#224968"/>
  <circle cx="414" cy="214" r="9" fill="#30648e"/>
  <circle cx="508" cy="214" r="9" fill="#6c757d"/>

  <!-- Row 4: Process startup -->
  <rect x="30" y="236" width="712" height="44" fill="#edf2f7" stroke="#e5e7eb"/>
  <text x="40" y="255" font-size="12" font-weight="600" fill="#1a2a3a">Process startup</text>
  <text x="40" y="271" font-size="10" fill="#556">exit codes, signal handling, config and secret loading, lock acquisition</text>
  <circle cx="602" cy="258" r="9" fill="#224968"/>

  <!-- Row 5: External source & sink -->
  <rect x="30" y="280" width="712" height="44" fill="#ffffff" stroke="#e5e7eb" stroke-dasharray="5,3"/>
  <text x="40" y="299" font-size="12" font-weight="600" fill="#1a2a3a">External source and sink</text>
  <text x="40" y="315" font-size="10" fill="#556">data store, broker, file system; doubled in component, real in gateway</text>
  <circle cx="320" cy="302" r="9" fill="none" stroke="#224968" stroke-width="2"/>
  <circle cx="414" cy="302" r="9" fill="#30648e"/>
  <circle cx="696" cy="302" r="9" fill="#6c757d"/>

  <!-- Row 6: External scheduler & clock -->
  <rect x="30" y="324" width="712" height="44" fill="#edf2f7" stroke="#e5e7eb" stroke-dasharray="5,3"/>
  <text x="40" y="343" font-size="12" font-weight="600" fill="#1a2a3a">External scheduler and system clock</text>
  <text x="40" y="359" font-size="10" fill="#556">cron expression, environment, secrets, time zone wiring</text>
  <circle cx="320" cy="346" r="9" fill="none" stroke="#224968" stroke-width="2"/>
  <circle cx="696" cy="346" r="9" fill="#6c757d"/>

  <!-- Legend -->
  <circle cx="44" cy="402" r="8" fill="#224968"/>
  <text x="58" y="406" font-size="11" fill="#556">Real code under test</text>
  <circle cx="206" cy="402" r="8" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="220" y="406" font-size="11" fill="#556">Doubled in this test</text>
  <text x="370" y="406" font-size="11" fill="#556">Empty cell: layer not exercised by that test type</text>
  <text x="44" y="438" font-size="10" fill="#556" font-style="italic">
    Note: deployed-binary tests run a small set of component tests against the actual artifact the scheduler will invoke.
  </text>
  <text x="44" y="454" font-size="10" fill="#556" font-style="italic">
    Out-of-band check uses the real scheduler and real system clock to validate doubles still match production wiring.
  </text>
</svg>
