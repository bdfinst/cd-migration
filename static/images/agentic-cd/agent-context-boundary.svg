<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="acb-title acb-desc">
  <title id="acb-title">Agent Context Boundary: Orchestrator vs Sub-agent Context</title>
  <desc id="acb-desc">Two boxes side by side. The left Orchestrator box contains its full context: staged_diff, bdd_scenario, feature_description, and history. The right Sub-agent (Semantic Review) box contains only logic_files and bdd_scenario. Between them an arrow labeled "structured JSON only" passes through a filter funnel shape. Below the arrow, items that do NOT cross the boundary are shown in light red: history, feature_description, and unrelated files. A return arrow from right to left is labeled with the response JSON schema.</desc>

  <!-- Background -->
  <rect width="720" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-l" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#374151"/>
    </marker>
  </defs>

  <!-- Left box: Orchestrator -->
  <rect x="20" y="40" width="230" height="260" rx="6" ry="6" fill="#e0e7ff" stroke="#4B6BFB" stroke-width="2"/>
  <rect x="20" y="40" width="230" height="36" rx="6" ry="6" fill="#4B6BFB"/>
  <!-- bottom corners of header not rounded -->
  <rect x="20" y="62" width="230" height="14" fill="#4B6BFB"/>
  <text x="135" y="63" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Orchestrator</text>

  <!-- Context items in orchestrator -->
  <text x="40" y="104" font-family="Arial, sans-serif" font-size="11" fill="#374151">Full context:</text>
  <!-- item: staged_diff -->
  <rect x="35" y="114" width="195" height="26" rx="4" ry="4" fill="#c7d2fe" stroke="#818cf8" stroke-width="1"/>
  <text x="132" y="131" font-family="Arial, monospace, monospace" font-size="11" fill="#1e1b4b" text-anchor="middle">staged_diff</text>
  <!-- item: bdd_scenario -->
  <rect x="35" y="148" width="195" height="26" rx="4" ry="4" fill="#c7d2fe" stroke="#818cf8" stroke-width="1"/>
  <text x="132" y="165" font-family="Arial, monospace, monospace" font-size="11" fill="#1e1b4b" text-anchor="middle">bdd_scenario</text>
  <!-- item: feature_description (does NOT cross) -->
  <rect x="35" y="182" width="195" height="26" rx="4" ry="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="132" y="199" font-family="Arial, monospace, monospace" font-size="11" fill="#6b7280" text-anchor="middle">feature_description</text>
  <!-- item: history (does NOT cross) -->
  <rect x="35" y="216" width="195" height="26" rx="4" ry="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="132" y="233" font-family="Arial, monospace, monospace" font-size="11" fill="#6b7280" text-anchor="middle">history</text>
  <!-- item: unrelated files (does NOT cross) -->
  <rect x="35" y="250" width="195" height="26" rx="4" ry="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="132" y="267" font-family="Arial, monospace, monospace" font-size="11" fill="#6b7280" text-anchor="middle">unrelated_files</text>

  <!-- Right box: Sub-agent -->
  <rect x="470" y="90" width="230" height="170" rx="6" ry="6" fill="#d1fae5" stroke="#34A853" stroke-width="2"/>
  <rect x="470" y="90" width="230" height="36" rx="6" ry="6" fill="#34A853"/>
  <rect x="470" y="112" width="230" height="14" fill="#34A853"/>
  <text x="585" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Sub-agent</text>
  <text x="585" y="127" font-family="Arial, sans-serif" font-size="11" fill="#d0f0db" text-anchor="middle">(Semantic Review)</text>

  <!-- Context items in sub-agent (lean) -->
  <text x="490" y="156" font-family="Arial, sans-serif" font-size="11" fill="#374151">Receives only:</text>
  <!-- item: logic_files -->
  <rect x="485" y="165" width="195" height="28" rx="4" ry="4" fill="#a7f3d0" stroke="#34A853" stroke-width="1"/>
  <text x="582" y="183" font-family="Arial, monospace, monospace" font-size="11" fill="#064e3b" text-anchor="middle">logic_files</text>
  <!-- item: bdd_scenario -->
  <rect x="485" y="202" width="195" height="28" rx="4" ry="4" fill="#a7f3d0" stroke="#34A853" stroke-width="1"/>
  <text x="582" y="220" font-family="Arial, monospace, monospace" font-size="11" fill="#064e3b" text-anchor="middle">bdd_scenario</text>

  <!-- Funnel / filter shape between boxes -->
  <!-- Funnel body polygon: wide left, narrow right -->
  <polygon points="290,148 360,168 360,192 290,212" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <!-- Funnel left brace indicator -->
  <line x1="360" y1="168" x2="390" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="360" y1="192" x2="390" y2="185" stroke="#555" stroke-width="1.5"/>

  <!-- Arrow from orchestrator to funnel -->
  <line x1="250" y1="180" x2="289" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- Arrow from funnel to sub-agent -->
  <line x1="390" y1="180" x2="468" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- Label above the filter/arrow -->
  <text x="360" y="155" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#374151" text-anchor="middle">structured JSON only</text>

  <!-- "Does NOT cross" section below -->
  <text x="360" y="240" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">does NOT cross:</text>
  <text x="290" y="258" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">x  history</text>
  <text x="360" y="258" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">x  feature_description</text>
  <text x="480" y="258" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">x  unrelated_files</text>

  <!-- Return arrow: sub-agent -> orchestrator, labeled with JSON -->
  <path d="M 585,260 Q 585,330 360,330 Q 135,330 135,310" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-l)"/>
  <text x="360" y="350" font-family="Arial, monospace, monospace" font-size="10" fill="#374151" text-anchor="middle">&#123; "decision": "pass|block", "findings": [...] &#125;</text>
  <text x="360" y="365" font-family="Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">return path</text>

</svg>
