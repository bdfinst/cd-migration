<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Multi-Agent Pipeline: Code Review Workflow</title>
  <desc id="map-desc">A flowchart showing Claude as orchestrator receiving staged_diff, bdd_scenario, and feature_description, routing work in parallel to three sub-agents: Semantic Review (Gemini), Test Spec Validation, and Security Review, each returning a decision and findings JSON object, which Claude aggregates into a final decision and agent_results response.</desc>

  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Claude Orchestrator box -->
  <rect x="20" y="155" width="175" height="110" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="107" y="196" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Claude</text>
  <text x="107" y="214" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Orchestrator</text>
  <text x="107" y="238" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">staged_diff</text>
  <text x="107" y="252" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">bdd_scenario</text>
  <text x="107" y="266" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">feature_description</text>

  <!-- Arrow: orchestrator -> semantic review -->
  <line x1="195" y1="175" x2="295" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Label on arrow -->
  <text x="230" y="127" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle" transform="rotate(-27, 230, 127)">logic_files + bdd_scenario</text>

  <!-- Arrow: orchestrator -> test spec validation -->
  <line x1="195" y1="210" x2="295" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="244" y="203" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">test_files + bdd_scenario</text>

  <!-- Arrow: orchestrator -> security review -->
  <line x1="195" y1="245" x2="295" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="235" y="302" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle" transform="rotate(27, 235, 302)">config_files only</text>

  <!-- Sub-agent 1: Semantic Review (Gemini) -->
  <rect x="295" y="50" width="190" height="100" rx="6" ry="6" fill="#34A853" stroke="#2a8f45" stroke-width="1.5"/>
  <text x="390" y="84" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Semantic Review</text>
  <text x="390" y="102" font-family="Arial, sans-serif" font-size="11" fill="#d0f0db" text-anchor="middle">(Gemini)</text>
  <text x="390" y="122" font-family="Arial, sans-serif" font-size="10" fill="#d0f0db" text-anchor="middle">logic_files + bdd_scenario</text>
  <text x="390" y="138" font-family="Arial, sans-serif" font-size="10" fill="#d0f0db" text-anchor="middle">checks semantic match</text>

  <!-- Sub-agent 2: Test Spec Validation -->
  <rect x="295" y="160" width="190" height="100" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="390" y="194" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Test Spec</text>
  <text x="390" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Validation</text>
  <text x="390" y="234" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">test_files + bdd_scenario</text>
  <text x="390" y="250" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">checks BDD coverage</text>

  <!-- Sub-agent 3: Security Review -->
  <rect x="295" y="270" width="190" height="100" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="390" y="304" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Security Review</text>
  <text x="390" y="326" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">config_files only</text>
  <text x="390" y="342" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">checks injection / authz</text>

  <!-- Return arrows with JSON labels -->
  <!-- Semantic Review -> aggregator -->
  <line x1="485" y1="100" x2="580" y2="163" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="548" y="120" font-family="Arial, monospace, monospace" font-size="9" fill="#333" text-anchor="middle" transform="rotate(27, 548, 120)">{decision, findings}</text>

  <!-- Test Spec -> aggregator -->
  <line x1="485" y1="210" x2="580" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="532" y="203" font-family="Arial, monospace, monospace" font-size="9" fill="#333" text-anchor="middle">{decision, findings}</text>

  <!-- Security Review -> aggregator -->
  <line x1="485" y1="320" x2="580" y2="257" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="549" y="310" font-family="Arial, monospace, monospace" font-size="9" fill="#333" text-anchor="middle" transform="rotate(-27, 549, 310)">{decision, findings}</text>

  <!-- Aggregation / Result box -->
  <rect x="580" y="155" width="185" height="110" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="672" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Claude</text>
  <text x="672" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Aggregates</text>
  <text x="672" y="234" font-family="Arial, monospace, monospace" font-size="10" fill="#dce4ff" text-anchor="middle">{decision,</text>
  <text x="672" y="249" font-family="Arial, monospace, monospace" font-size="10" fill="#dce4ff" text-anchor="middle">agent_results}</text>

  <!-- "Parallel" bracket / label -->
  <line x1="290" y1="45" x2="290" y2="375" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="490" y1="45" x2="490" y2="375" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="390" y="400" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">parallel execution</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
</svg>
