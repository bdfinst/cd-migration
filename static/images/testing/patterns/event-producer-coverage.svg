  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="316" y="350" width="80" height="20" rx="10" fill="none" stroke="#224968" stroke-width="2"/><text x="356" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#224968">Component</text></a>
