{{- $title := .Get "title" | default "Show code" -}}
{{- $lang := .Get "lang" | default "" -}}
{{- $open := eq (.Get "open") "true" -}}
<details class="code-collapse"{{ if $open }} open{{ end }}>
  <summary class="code-collapse__summary">{{ $title }}</summary>
  <div class="code-collapse__content">
    {{ if $lang }}
      {{ highlight (trim .Inner "\n") $lang "" }}
    {{ else }}
      {{ .Inner }}
    {{ end }}
  </div>
</details>
