  <text x="50" y="382" font-size="11" font-style="italic" fill="#556">Doubled in component; real in adapter integration; OOB synthetic state change on a schedule.</text>

  <!-- Layer 5: Database (external) -->
  <rect x="30" y="404" width="660" height="60" rx="6" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="30" y="404" width="6" height="60" fill="#6c757d"/>
  <text x="50" y="428" font-size="14" font-weight="700" fill="#1a2a3a">Database (external)</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="450" y="414" width="80" height="20" rx="10" fill="#224968"/><text x="490" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <a href="/docs/testing/glossary/#adapter-integration-test" target="_top"><rect x="536" y="414" width="144" height="20" rx="10" fill="#30648e"/><text x="608" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Adapter integration</text></a>
  <text x="50" y="452" font-size="11" font-style="italic" fill="#556">Real DB in component to validate outbox atomicity</text>

