<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="cdp-title cdp-desc">
  <title id="cdp-title">CD Pipeline: Where Tests Run</title>
  <desc id="cdp-desc">Four horizontal lanes. Pipeline lane: Commit triggers pre-merge and CI checks (Static Analysis, Unit Tests, Component Tests, Contract Tests - deterministic, blocks merge), then Build Artifact, Deploy to test environment (validates artifact starts and configures correctly), Acceptance Tests in test environment (Functional, Load, Chaos, Resilience, Compliance - gates promotion to production), Deploy to production, and a green Live checkmark. Post-deploy lane: Production Verification (Health Checks, Real User Monitoring, SLO) triggered after production deploy - non-deterministic, triggers alerts, never blocks promotion. Async lane: Integration Tests validate contract test doubles against real systems - non-deterministic, post-deploy, failures trigger review. Continuous lane: Exploratory Testing and Usability Testing run continuously and never block.</desc>

  <defs>
    <!-- Drop shadow for primary boxes -->
    <filter id="shadow-sm" x="-8%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000020"/>
    </filter>
    <filter id="shadow-xs" x="-6%" y="-8%" width="116%" height="132%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000018"/>
    </filter>

    <!-- Lane background gradients -->
    <linearGradient id="bg-pipeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f5e9"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="bg-postdeploy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fffdf5"/>
    </linearGradient>
    <linearGradient id="bg-async" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bg-continuous" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>

    <!-- Box fill gradients -->
    <linearGradient id="fill-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3d5c"/>
      <stop offset="1" stop-color="#112840"/>
    </linearGradient>
    <linearGradient id="fill-navy-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152f4a"/>
      <stop offset="1" stop-color="#0c1e30"/>
    </linearGradient>
    <linearGradient id="fill-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="fill-live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arr-main" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#4b5563"/>
    </marker>
    <marker id="arr-down" markerWidth="8" markerHeight="7" refX="4" refY="8" orient="auto">
      <polygon points="0 0,8 0,4 7" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ── Lane backgrounds ── -->
  <rect x="0"   y="0"   width="800" height="142" fill="url(#bg-pipeline)"/>
  <rect x="0"   y="142" width="800" height="112" fill="url(#bg-postdeploy)"/>
  <rect x="0"   y="254" width="800" height="80"  fill="url(#bg-async)"/>
  <rect x="0"   y="334" width="800" height="76"  fill="url(#bg-continuous)"/>

  <!-- ── Lane label strips ── -->
  <rect x="0" y="0"   width="26" height="142" fill="#15803d"/>
  <rect x="0" y="142" width="26" height="112" fill="#b45309"/>
  <rect x="0" y="254" width="26" height="80"  fill="#475569"/>
  <rect x="0" y="334" width="26" height="76"  fill="#6d28d9"/>

  <!-- Subtle inner highlight on strips -->
  <rect x="24" y="0"   width="2" height="142" fill="#ffffff18"/>
  <rect x="24" y="142" width="2" height="112" fill="#ffffff18"/>
  <rect x="24" y="254" width="2" height="80"  fill="#ffffff18"/>
  <rect x="24" y="334" width="2" height="76"  fill="#ffffff18"/>

  <!-- ── Lane label text (rotated) ── -->
  <text transform="rotate(-90,13,71)"  x="13" y="71"  text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.12em" fill="#ffffff" opacity="0.95">PIPELINE</text>
  <text transform="rotate(-90,13,198)" x="13" y="198" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7" font-weight="700" letter-spacing="0.10em" fill="#ffffff" opacity="0.95">POST-DEPLOY</text>
  <text transform="rotate(-90,13,294)" x="13" y="294" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.12em" fill="#ffffff" opacity="0.95">ASYNC</text>
  <text transform="rotate(-90,13,372)" x="13" y="372" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7" font-weight="700" letter-spacing="0.10em" fill="#ffffff" opacity="0.95">CONTINUOUS</text>

  <!-- ── Lane dividers ── -->
  <line x1="26" y1="142" x2="800" y2="142" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="26" y1="254" x2="800" y2="254" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="26" y1="334" x2="800" y2="334" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ════════════════════════════════════════
       PIPELINE LANE  (centerline y=76)
  ════════════════════════════════════════ -->

  <!-- Pipeline connector track (subtle baseline) -->
  <line x1="32" y1="76" x2="768" y2="76" stroke="#c8d8e8" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- Commit circle -->
  <circle cx="46" cy="76" r="20" fill="url(#fill-navy)" filter="url(#shadow-sm)"/>
  <circle cx="46" cy="76" r="20" fill="none" stroke="#3b6b99" stroke-width="1"/>
  <text x="46" y="73" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="#93c5fd">COM</text>
  <text x="46" y="84" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="#93c5fd">MIT</text>

  <!-- Arrow: commit → pre-merge -->
  <line x1="66" y1="76" x2="75" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Pre-merge / CI box -->
  <rect x="78" y="31" width="172" height="84" rx="6" fill="url(#fill-green)" filter="url(#shadow-sm)"/>
  <rect x="78" y="31" width="172" height="84" rx="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <text x="164" y="52"  text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0.01em" fill="#ffffff">Pre-merge / CI</text>
  <text x="164" y="67"  text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#bbf7d0">Static Analysis</text>
  <text x="164" y="81"  text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#bbf7d0">Unit Tests</text>
  <text x="164" y="95"  text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#bbf7d0">Component Tests</text>
  <text x="164" y="109" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" fill="#bbf7d0">Contract Tests</text>
  <!-- badge -->
  <rect x="78" y="118" width="172" height="15" rx="4" fill="#15803d"/>
  <rect x="78" y="118" width="172" height="15" rx="4" fill="none" stroke="#4ade80" stroke-width="0.75" opacity="0.5"/>
  <text x="164" y="129" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.08em" fill="#dcfce7">DETERMINISTIC · BLOCKS MERGE</text>

  <!-- Arrow: pre-merge → build -->
  <line x1="250" y1="76" x2="260" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Build box -->
  <rect x="263" y="54" width="68" height="44" rx="6" fill="url(#fill-navy)" filter="url(#shadow-sm)"/>
  <rect x="263" y="54" width="68" height="44" rx="6" fill="none" stroke="#3b6b99" stroke-width="1" opacity="0.6"/>
  <text x="297" y="73" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#ffffff">Build</text>
  <text x="297" y="87" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#93c5fd">artifact</text>

  <!-- Arrow: build → deploy test -->
  <line x1="331" y1="76" x2="341" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Deploy Test box -->
  <rect x="344" y="50" width="98" height="52" rx="6" fill="url(#fill-navy)" filter="url(#shadow-sm)"/>
  <rect x="344" y="50" width="98" height="52" rx="6" fill="none" stroke="#3b6b99" stroke-width="1" opacity="0.6"/>
  <text x="393" y="68" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#ffffff">Deploy</text>
  <text x="393" y="81" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#93c5fd">test environment</text>
  <text x="393" y="94" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7" fill="#60a5fa" font-style="italic">deploy process tested</text>

  <!-- Arrow: deploy test → acceptance tests -->
  <line x1="442" y1="76" x2="452" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Acceptance Tests box (pipeline, blocking) - taller to show test types -->
  <rect x="455" y="38" width="110" height="76" rx="6" fill="url(#fill-navy)" filter="url(#shadow-sm)"/>
  <rect x="455" y="38" width="110" height="76" rx="6" fill="none" stroke="#3b6b99" stroke-width="1" opacity="0.6"/>
  <!-- top accent bar -->
  <rect x="455" y="38" width="110" height="4" rx="3" fill="#3b82f6" opacity="0.7"/>
  <text x="510" y="57" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">Acceptance Tests</text>
  <text x="510" y="71" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" fill="#93c5fd">Functional · Load · Chaos</text>
  <text x="510" y="83" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8" fill="#93c5fd">Resilience · Compliance</text>
  <text x="510" y="105" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7" fill="#60a5fa" font-style="italic">gates production deploy</text>

  <!-- Arrow: acceptance tests → deploy prod -->
  <line x1="565" y1="76" x2="575" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Deploy Prod box -->
  <rect x="578" y="54" width="98" height="44" rx="6" fill="url(#fill-navy-deep)" filter="url(#shadow-sm)"/>
  <rect x="578" y="54" width="98" height="44" rx="6" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
  <text x="627" y="73" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#ffffff">Deploy</text>
  <text x="627" y="87" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#93c5fd">production</text>

  <!-- Arrow: deploy prod → live -->
  <line x1="676" y1="76" x2="686" y2="76" stroke="#4b5563" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Live circle -->
  <circle cx="703" cy="76" r="20" fill="url(#fill-live)" filter="url(#shadow-sm)"/>
  <circle cx="703" cy="76" r="20" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.6"/>
  <text x="703" y="81" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" fill="#ffffff">&#x2713;</text>
  <text x="703" y="112" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="600" fill="#16a34a">Live</text>

  <!-- ════════════════════════════════════════
       POST-DEPLOY LANE  (y 142–254)
  ════════════════════════════════════════ -->

  <!-- Dashed down arrow: Deploy Prod → Prod Verification box -->
  <line x1="627" y1="99" x2="627" y2="152" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-down)"/>

  <!-- Production Verification box -->
  <rect x="560" y="154" width="134" height="68" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow-xs)"/>
  <rect x="560" y="154" width="134" height="4"  rx="3" fill="#d97706" opacity="0.7"/>
  <text x="627" y="173" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">Prod Verification</text>
  <text x="627" y="187" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#92400e">Health Checks · SLO</text>
  <text x="627" y="199" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#92400e">Real User Monitoring</text>
  <text x="627" y="213" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" fill="#b45309" font-style="italic">non-deterministic · triggers alerts</text>

  <!-- Post-deploy description text -->
  <text x="560" y="238" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-style="italic" fill="#b45309" opacity="0.8">triggered after deploy · never blocks promotion</text>

  <!-- ════════════════════════════════════════
       ASYNC LANE  (y 254–334)
  ════════════════════════════════════════ -->

  <!-- Integration tests spanning box -->
  <rect x="32" y="266" width="742" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,3" filter="url(#shadow-xs)"/>
  <text x="400" y="289" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e293b">Integration Tests</text>
  <text x="400" y="304" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#475569">validates contract test doubles against real systems  ·  non-deterministic  ·  post-deploy  ·  failures trigger review</text>
  <text x="52" y="291" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#94a3b8">&#x23F1;</text>

  <!-- ════════════════════════════════════════
       CONTINUOUS LANE  (y 334–410)
  ════════════════════════════════════════ -->

  <!-- Exploratory Testing box -->
  <rect x="32" y="344" width="368" height="52" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow-xs)"/>
  <text x="216" y="364" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Exploratory Testing</text>
  <text x="216" y="379" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#6d28d9">unscripted investigation  ·  never blocks  ·  continuous</text>

  <!-- Usability Testing box -->
  <rect x="412" y="344" width="362" height="52" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow-xs)"/>
  <text x="593" y="364" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Usability Testing</text>
  <text x="593" y="379" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" fill="#6d28d9">real user validation  ·  never blocks  ·  informs product decisions</text>
</svg>
