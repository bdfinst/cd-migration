<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="hl-title hl-desc">
  <title id="hl-title">Hook Lifecycle: Pre-hooks, Model Invocation, and Post-hooks</title>
  <desc id="hl-desc">A left-to-right flowchart showing: Trigger/Command passes input to Pre-hooks (validate-pipeline-health, inject-system-constraints, validate-inputs), which passes validated context to Model Invocation (Claude or Gemini), which passes raw output to Post-hooks (validate-output-schema, log-invocation), which passes validated output to the Orchestrator. Pre-hooks and Post-hooks each have a dashed red failure path labeled on-fail: block and Hard failure respectively.</desc>

  <!-- Background -->
  <rect width="820" height="340" fill="#ffffff"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Box 1: Trigger / Command -->
  <rect x="10" y="110" width="120" height="64" rx="6" ry="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="70" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Trigger /</text>
  <text x="70" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Command</text>

  <!-- Arrow: Trigger -> Pre-hooks -->
  <line x1="130" y1="142" x2="160" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="135" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">input</text>

  <!-- Box 2: Pre-hooks -->
  <rect x="160" y="86" width="160" height="112" rx="6" ry="6" fill="#F59E0B" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Pre-hooks</text>
  <line x1="170" y1="120" x2="310" y2="120" stroke="#fff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="240" y="136" font-family="Arial, sans-serif" font-size="9.5" fill="#fff8e1" text-anchor="middle">validate-pipeline-health</text>
  <text x="240" y="152" font-family="Arial, sans-serif" font-size="9.5" fill="#fff8e1" text-anchor="middle">inject-system-constraints</text>
  <text x="240" y="168" font-family="Arial, sans-serif" font-size="9.5" fill="#fff8e1" text-anchor="middle">validate-inputs</text>

  <!-- Dashed red arrow: Pre-hooks fail -> Block -->
  <line x1="240" y1="198" x2="240" y2="265" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="180" y="265" width="120" height="40" rx="4" ry="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="240" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">Block (fail fast)</text>
  <text x="240" y="298" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">on-fail: block</text>

  <!-- Arrow: Pre-hooks -> Model Invocation -->
  <line x1="320" y1="142" x2="360" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="340" y="130" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">validated</text>
  <text x="340" y="141" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">context</text>

  <!-- Box 3: Model Invocation -->
  <rect x="360" y="100" width="140" height="84" rx="6" ry="6" fill="#4B6BFB" stroke="#3558e8" stroke-width="1.5"/>
  <text x="430" y="133" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="430" y="151" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Invocation</text>
  <text x="430" y="172" font-family="Arial, sans-serif" font-size="10" fill="#dce4ff" text-anchor="middle">Claude or Gemini</text>

  <!-- Arrow: Model Invocation -> Post-hooks -->
  <line x1="500" y1="142" x2="540" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="132" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">raw output</text>

  <!-- Box 4: Post-hooks -->
  <rect x="540" y="90" width="155" height="104" rx="6" ry="6" fill="#F59E0B" stroke="#d97706" stroke-width="1.5"/>
  <text x="617" y="116" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Post-hooks</text>
  <line x1="550" y1="124" x2="685" y2="124" stroke="#fff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="617" y="142" font-family="Arial, sans-serif" font-size="9.5" fill="#fff8e1" text-anchor="middle">validate-output-schema</text>
  <text x="617" y="159" font-family="Arial, sans-serif" font-size="9.5" fill="#fff8e1" text-anchor="middle">log-invocation</text>

  <!-- Dashed red arrow: Post-hooks fail -> Hard failure -->
  <line x1="617" y1="194" x2="617" y2="265" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="557" y="265" width="120" height="40" rx="4" ry="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="617" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">Hard failure</text>
  <text x="617" y="298" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">schema violation</text>

  <!-- Arrow: Post-hooks -> Orchestrator -->
  <line x1="695" y1="142" x2="730" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="131" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">validated</text>
  <text x="712" y="143" font-family="Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">output</text>

  <!-- Box 5: Orchestrator -->
  <rect x="730" y="110" width="80" height="64" rx="6" ry="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="770" y="146" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Orchestrator</text>

</svg>
