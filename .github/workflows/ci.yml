name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.3"

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.161.1/hugo_extended_0.161.1_linux-amd64.deb
          sudo dpkg -i hugo_extended_0.161.1_linux-amd64.deb

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Check links
        run: npx linkinator --recurse public/ --config ./linkinator.config.json
