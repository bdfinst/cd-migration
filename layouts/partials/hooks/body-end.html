<script>
// Add aria-label to task list checkboxes for WCAG 2.1 AA compliance
document.querySelectorAll('li > input[type="checkbox"][disabled]').forEach(function(cb) {
  if (!cb.getAttribute('aria-label')) {
    var text = cb.parentElement.textContent.trim();
    if (text) cb.setAttribute('aria-label', text);
  }
});
</script>
