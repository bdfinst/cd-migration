<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="e2e-title e2e-desc">
  <title id="e2e-title">End-to-End Test Scope Spectrum</title>
  <desc id="e2e-desc">Two examples of end-to-end tests. Left: narrow scope showing a service making real calls to a real database. Right: full-system scope showing a browser driving a real frontend, which calls a real backend service, which calls a real database. All components are real with no test doubles at either scope.</desc>

  <rect width="720" height="340" fill="#ffffff"/>

  <defs>
    <marker id="e2e-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#374151">End-to-End Tests - Real Dependencies at Every Scope</text>
  <text x="360" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#dc2626">No test doubles - all components are real</text>

  <!-- Divider -->
  <line x1="360" y1="55" x2="360" y2="290" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- LEFT PANEL: Narrow scope -->
  <text x="180" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Narrow</text>
  <text x="180" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">service + real database</text>

  <!-- Test entry for narrow -->
  <rect x="10" y="128" width="42" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="31" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#5b21b6">Test</text>

  <!-- Arrow: test to service -->
  <line x1="52" y1="141" x2="72" y2="141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#e2e-arr)"/>

  <!-- Service (real, green) -->
  <rect x="72" y="116" width="120" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="132" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#064e3b">Service</text>
  <text x="132" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#059669">real</text>

  <!-- Arrow: service to database -->
  <line x1="192" y1="141" x2="214" y2="141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#e2e-arr)"/>

  <!-- Database cylinder (real, green) -->
  <ellipse cx="258" cy="122" rx="42" ry="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <rect x="216" y="122" width="84" height="48" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <ellipse cx="258" cy="170" rx="42" ry="10" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="258" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#064e3b">Database</text>
  <text x="258" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#059669">real</text>

  <!-- RIGHT PANEL: Full system scope -->
  <text x="540" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Full System</text>
  <text x="540" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">browser through every layer</text>

  <!-- Browser (test entry point) -->
  <rect x="374" y="116" width="74" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="411" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5b21b6">Browser</text>
  <text x="411" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">test entry</text>

  <!-- Arrow: browser to frontend -->
  <line x1="448" y1="141" x2="468" y2="141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#e2e-arr)"/>

  <!-- Frontend (real, green) -->
  <rect x="468" y="116" width="80" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="508" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#064e3b">Frontend</text>
  <text x="508" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#059669">real</text>

  <!-- Arrow: frontend to backend -->
  <line x1="548" y1="141" x2="568" y2="141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#e2e-arr)"/>

  <!-- Backend (real, green) -->
  <rect x="568" y="116" width="80" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="608" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#064e3b">Backend</text>
  <text x="608" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#059669">real</text>

  <!-- Arrow: backend to database -->
  <line x1="648" y1="141" x2="668" y2="141" stroke="#6b7280" stroke-width="1.5" marker-end="url(#e2e-arr)"/>

  <!-- Database cylinder (real, green) -->
  <ellipse cx="696" cy="122" rx="22" ry="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <rect x="674" y="122" width="44" height="40" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <ellipse cx="696" cy="162" rx="22" ry="7" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="696" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#064e3b">DB</text>
  <text x="696" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#059669">real</text>

  <!-- Shared characteristics box -->
  <rect x="80" y="218" width="560" height="56" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="360" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#991b1b">Applies at every scope</text>
  <text x="360" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#dc2626">Non-deterministic - never a pre-merge gate - runs post-deployment</text>

  <!-- Legend -->
  <rect x="80" y="300" width="12" height="12" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="96" y="311" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Test entry point</text>
  <rect x="240" y="300" width="12" height="12" rx="2" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="256" y="311" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Real component (no doubles)</text>
</svg>
