<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"
     role="img" aria-labelledby="pto-title pto-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="pto-title">Tests Outside the Pipeline</title>
  <desc id="pto-desc">Two-group diagram showing tests that run outside the deployment pipeline. Asynchronous (left): Integration Tests run on a schedule against real external systems to validate test doubles; failures trigger a test double update and re-verification, not a build failure. Post-Deployment (right): E2E Smoke Tests and Synthetic Monitoring run against production or production-like environments; failures trigger rollback or alerts, never block deployment.</desc>

  <!-- Background -->
  <rect width="720" height="380" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a3a">Tests Outside the Pipeline</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#667">Non-Deterministic - Never Blocks Deployment - Involves Real External Systems</text>

  <!-- Asynchronous container -->
  <rect x="30" y="72" width="290" height="195" rx="6" fill="#fdf6e3" stroke="#7a5c2e" stroke-width="1.5"/>
  <rect x="30" y="72" width="290" height="32" rx="6" fill="#7a5c2e"/>
  <rect x="30" y="92" width="290" height="12" fill="#7a5c2e"/>
  <text x="175" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Asynchronous (Scheduled)</text>

  <!-- Integration Tests -->
  <rect x="50" y="120" width="250" height="56" rx="4" fill="#7a5c2e" stroke="#5a4420" stroke-width="1"/>
  <text x="175" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Integration Tests</text>
  <text x="175" y="157" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Validate test doubles against real APIs</text>

  <!-- Schedule note -->
  <text x="175" y="198" text-anchor="middle" font-size="11" fill="#7a5c2e">Runs hourly or daily</text>
  <text x="175" y="214" text-anchor="middle" font-size="11" fill="#7a5c2e">Hits real external systems</text>
  <text x="175" y="246" text-anchor="middle" font-size="10" fill="#99885a">Failures trigger review, not build failure</text>

  <!-- Post-Deployment container -->
  <rect x="400" y="72" width="290" height="195" rx="6" fill="#fce4e4" stroke="#6b3a3a" stroke-width="1.5"/>
  <rect x="400" y="72" width="290" height="32" rx="6" fill="#6b3a3a"/>
  <rect x="400" y="92" width="290" height="12" fill="#6b3a3a"/>
  <text x="545" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Post-Deployment</text>

  <!-- E2E Smoke Tests -->
  <rect x="420" y="120" width="250" height="44" rx="4" fill="#6b3a3a" stroke="#4a2828" stroke-width="1"/>
  <text x="545" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">E2E Smoke Tests</text>
  <text x="545" y="155" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Critical happy paths in production-like env</text>

  <!-- Synthetic Monitoring -->
  <rect x="420" y="174" width="250" height="44" rx="4" fill="#6b3a3a" stroke="#4a2828" stroke-width="1"/>
  <text x="545" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Synthetic Monitoring</text>
  <text x="545" y="209" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Continuous production health checks</text>

  <text x="545" y="246" text-anchor="middle" font-size="10" fill="#8a5555">Failures trigger rollback or alerts</text>

  <!-- Feedback arrows and action boxes -->

  <!-- Integration test failure arrow -->
  <path d="M 175 267 L 175 300 L 175 316" fill="none" stroke="#7a5c2e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="175,316 170,308 180,308" fill="#7a5c2e"/>

  <!-- Update Test Doubles box -->
  <rect x="80" y="318" width="190" height="38" rx="4" fill="#fff" stroke="#7a5c2e" stroke-width="1.5"/>
  <text x="175" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5c2e">Update Test Doubles</text>
  <text x="175" y="349" text-anchor="middle" font-size="10" fill="#99885a">Re-verify component tests</text>

  <!-- Smoke test failure arrow -->
  <path d="M 490 267 L 490 316" fill="none" stroke="#6b3a3a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="490,316 485,308 495,308" fill="#6b3a3a"/>

  <!-- Rollback box -->
  <rect x="440" y="318" width="100" height="34" rx="4" fill="#fff" stroke="#6b3a3a" stroke-width="1.5"/>
  <text x="490" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#6b3a3a">Rollback</text>

  <!-- Monitoring failure arrow -->
  <path d="M 620 267 L 620 316" fill="none" stroke="#6b3a3a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="620,316 615,308 625,308" fill="#6b3a3a"/>

  <!-- Alerts box -->
  <rect x="575" y="318" width="90" height="34" rx="4" fill="#fff" stroke="#6b3a3a" stroke-width="1.5"/>
  <text x="620" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#6b3a3a">Alerts</text>

  <!-- Dashed failure labels -->
  <text x="155" y="290" font-size="9" fill="#99885a">on failure</text>
  <text x="475" y="290" font-size="9" fill="#8a5555">on failure</text>
  <text x="605" y="290" font-size="9" fill="#8a5555">on failure</text>

</svg>