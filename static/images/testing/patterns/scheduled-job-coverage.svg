<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 632"
     role="img" aria-labelledby="sjc-title sjc-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="sjc-title">Scheduled Job: layers and the tests that cover each</title>
  <desc id="sjc-desc">
    Six architectural layers stacked top to bottom. The first four (pure transformation logic, job orchestration, source and sink gateways, and process startup) are inside the component boundary. Below the dashed component boundary, the external source and sink and the external scheduler and system clock are drawn with dashed borders. Each band shows its name, a one-line description, and the test types that exercise it as small coloured pills. Solitary unit tests cover pure transformation. Component tests cover orchestration with the clock and gateways doubled. Gateway integration tests pin source and sink protocols against real containers. Deployed-binary tests cover process startup on the actual artifact. Out-of-band integration uses the real scheduler and clock on a schedule.
  </desc>

  <rect width="720" height="632" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a3a">
    Scheduled Job: Layers and the Tests That Cover Each
  </text>

  <!-- Inside boundary label -->
  <text x="40" y="56" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#224968">
    INSIDE THE COMPONENT BOUNDARY
  </text>

  <!-- Layer 1: Pure transformation logic -->
  <rect x="30" y="68" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="68" width="6" height="60" fill="#224968"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#1a2a3a">Pure transformation logic</text>
  <a href="/docs/testing/glossary/#solitary-unit-test" target="_top"><rect x="490" y="78" width="104" height="20" rx="10" fill="#4a6741"/><text x="542" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Solitary unit</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="78" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="116" font-size="11" font-style="italic" fill="#556">The data calculation, no I/O</text>

  <!-- Layer 2: Job orchestration -->
  <rect x="30" y="136" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="136" width="6" height="60" fill="#224968"/>
  <text x="50" y="160" font-size="14" font-weight="700" fill="#1a2a3a">Job orchestration</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="600" y="146" width="80" height="20" rx="10" fill="#224968"/><text x="640" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Component</text></a>
  <text x="50" y="184" font-size="11" font-style="italic" fill="#556">Idempotency, locking, time windows, checkpointing (injected clock)</text>

  <!-- Layer 3: Source and sink gateways -->
  <rect x="30" y="204" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="204" width="6" height="60" fill="#224968"/>
  <text x="50" y="228" font-size="14" font-weight="700" fill="#1a2a3a">Source and sink gateways</text>
  <a href="/docs/testing/glossary/#gateway-integration-test" target="_top"><rect x="346" y="214" width="144" height="20" rx="10" fill="#30648e"/><text x="418" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gateway integration</text></a>
  <a href="/docs/testing/glossary/#contract-test" target="_top"><rect x="496" y="214" width="124" height="20" rx="10" fill="#6c757d"/><text x="558" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Source/sink contract</text></a>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="626" y="214" width="54" height="20" rx="10" fill="#224968"/><text x="653" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Comp.</text></a>
  <text x="50" y="252" font-size="11" font-style="italic" fill="#556">Protocol, error mapping, transactional semantics</text>

  <!-- Layer 4: Process startup -->
  <rect x="30" y="272" width="660" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="30" y="272" width="6" height="60" fill="#224968"/>
  <text x="50" y="296" font-size="14" font-weight="700" fill="#1a2a3a">Process startup</text>
  <a href="/docs/testing/glossary/#deployed-binary-test" target="_top"><rect x="560" y="282" width="120" height="20" rx="10" fill="#224968"/><text x="620" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Deployed binary</text></a>
  <text x="50" y="320" font-size="11" font-style="italic" fill="#556">Exit codes, signal handling, config and secret loading, lock acquisition</text>

  <!-- Boundary divider -->
  <line x1="40" y1="354" x2="680" y2="354" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="350" text-anchor="middle" font-size="10" fill="#556" font-weight="600" font-style="italic">component boundary</text>

  <!-- Outside boundary label -->
  <text x="40" y="372" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#6c757d">
    OUTSIDE THE BOUNDARY
  </text>

  <!-- Layer 5: External source and sink -->
  <rect x="30" y="384" width="660" height="80" rx="6" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="30" y="384" width="6" height="80" fill="#6c757d"/>
  <text x="50" y="408" font-size="14" font-weight="700" fill="#1a2a3a">External source and sink</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="386" y="418" width="80" height="20" rx="10" fill="none" stroke="#224968" stroke-width="2"/><text x="426" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#224968">Component</text></a>
  <a href="/docs/testing/glossary/#gateway-integration-test" target="_top"><rect x="472" y="418" width="120" height="20" rx="10" fill="#30648e"/><text x="532" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Gateway integ.</text></a>
  <a href="/docs/testing/glossary/#out-of-band-test" target="_top"><rect x="598" y="418" width="82" height="20" rx="10" fill="#6c757d"/><text x="639" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">OOB integ.</text></a>
  <text x="50" y="450" font-size="11" font-style="italic" fill="#556">Data store, broker, file system. Doubled in component; real in gateway integration.</text>

  <!-- Layer 6: External scheduler and system clock -->
  <rect x="30" y="472" width="660" height="80" rx="6" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="30" y="472" width="6" height="80" fill="#6c757d"/>
  <text x="50" y="496" font-size="14" font-weight="700" fill="#1a2a3a">External scheduler and system clock</text>
  <a href="/docs/testing/glossary/#component-test" target="_top"><rect x="476" y="506" width="120" height="20" rx="10" fill="none" stroke="#224968" stroke-width="2"/><text x="536" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#224968">Component (clock doubled)</text></a>
  <a href="/docs/testing/glossary/#out-of-band-test" target="_top"><rect x="602" y="506" width="78" height="20" rx="10" fill="#6c757d"/><text x="641" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">OOB integ.</text></a>
  <text x="50" y="538" font-size="11" font-style="italic" fill="#556">Cron expression, env, secrets, time-zone wiring. OOB check uses the real scheduler and clock.</text>

  <!-- Legend -->
  <rect x="40" y="582" width="30" height="16" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="582" width="4" height="16" fill="#224968"/>
  <text x="78" y="594" font-size="11" fill="#556">internal layer</text>
  <rect x="320" y="583" width="24" height="14" rx="7" fill="#224968"/>
  <text x="354" y="594" font-size="11" fill="#556">real code under test</text>

  <rect x="40" y="606" width="30" height="16" rx="3" fill="#edf2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="40" y="606" width="4" height="16" fill="#6c757d"/>
  <text x="78" y="618" font-size="11" fill="#556">external (dashed border)</text>
  <rect x="320" y="607" width="24" height="14" rx="7" fill="none" stroke="#224968" stroke-width="2"/>
  <text x="354" y="618" font-size="11" fill="#556">doubled in this test</text>

</svg>
