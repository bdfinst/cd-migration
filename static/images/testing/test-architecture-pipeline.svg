<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="cdp-title cdp-desc">
  <title id="cdp-title">CD Pipeline: Where Tests Run</title>
  <desc id="cdp-desc">Four horizontal lanes. Pipeline lane: Commit triggers Static Analysis, Unit Tests, and Component Tests (deterministic, blocks merge), then Build Artifact, Deploy to test environment, and Deploy to production, ending with a green checkmark. Post-deploy lane: E2E Smoke Tests are triggered after deploying to the test environment (non-deterministic, triggers rollback); E2E Smoke Tests and Synthetic Monitoring are triggered after deploying to production (non-deterministic, triggers alerts and rollback). Async lane: Contract Tests run on a schedule or when contracts change across the whole pipeline width (non-deterministic, triggers review, never blocks). Continuous lane: Exploratory Testing and Usability Testing run continuously alongside delivery and never block the pipeline.</desc>

  <defs>
    <marker id="cdp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6b7280"/>
    </marker>
    <marker id="cdp-arr-down" markerWidth="8" markerHeight="6" refX="4" refY="7" orient="auto">
      <polygon points="0 0,8 0,4 6" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ── Lane backgrounds ── -->
  <rect x="0"   y="0"   width="800" height="138" fill="#f0fdf4"/>
  <rect x="0"   y="138" width="800" height="96"  fill="#fffbeb"/>
  <rect x="0"   y="234" width="800" height="78"  fill="#f8fafc"/>
  <rect x="0"   y="312" width="800" height="78"  fill="#faf5ff"/>

  <!-- ── Lane label strips ── -->
  <rect x="0" y="0"   width="22" height="138" fill="#16a34a"/>
  <rect x="0" y="138" width="22" height="96"  fill="#b45309"/>
  <rect x="0" y="234" width="22" height="78"  fill="#64748b"/>
  <rect x="0" y="312" width="22" height="78"  fill="#7c3aed"/>

  <!-- ── Lane label text (rotated) ── -->
  <text transform="rotate(-90,11,69)"  x="11" y="69"  text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.08em" fill="#fff">PIPELINE</text>
  <text transform="rotate(-90,11,186)" x="11" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" letter-spacing="0.07em" fill="#fff">POST-DEPLOY</text>
  <text transform="rotate(-90,11,273)" x="11" y="273" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.08em" fill="#fff">ASYNC</text>
  <text transform="rotate(-90,11,351)" x="11" y="351" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="700" letter-spacing="0.07em" fill="#fff">CONTINUOUS</text>

  <!-- ── Lane dividers ── -->
  <line x1="22" y1="138" x2="800" y2="138" stroke="#d1d5db" stroke-width="1"/>
  <line x1="22" y1="234" x2="800" y2="234" stroke="#d1d5db" stroke-width="1"/>
  <line x1="22" y1="312" x2="800" y2="312" stroke="#d1d5db" stroke-width="1"/>

  <!-- ════════════════════════════════════════
       PIPELINE LANE  (centerline y=75)
  ════════════════════════════════════════ -->

  <!-- Commit circle -->
  <circle cx="46" cy="75" r="18" fill="#224968"/>
  <text x="46" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">COM</text>
  <text x="46" y="83" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#fff">MIT</text>

  <!-- Arrow: commit → pre-merge -->
  <line x1="65" y1="75" x2="77" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#cdp-arr)"/>

  <!-- Pre-merge box -->
  <rect x="80" y="34" width="188" height="80" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="174" y="54"  text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#14532d">Pre-merge</text>
  <text x="174" y="69"  text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#166534">Static Analysis</text>
  <text x="174" y="83"  text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#166534">Unit Tests</text>
  <text x="174" y="97"  text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#166534">Component Tests</text>
  <!-- badge -->
  <rect x="80" y="116" width="188" height="14" rx="3" fill="#16a34a"/>
  <text x="174" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.05em" fill="#fff">DETERMINISTIC · BLOCKS MERGE</text>

  <!-- Arrow: pre-merge → build -->
  <line x1="268" y1="75" x2="282" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#cdp-arr)"/>

  <!-- Build box -->
  <rect x="285" y="53" width="80" height="44" rx="5" fill="#224968"/>
  <text x="325" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Build</text>
  <text x="325" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#93c5fd">artifact</text>

  <!-- Arrow: build → deploy test -->
  <line x1="366" y1="75" x2="380" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#cdp-arr)"/>

  <!-- Deploy Test box -->
  <rect x="383" y="53" width="108" height="44" rx="5" fill="#224968"/>
  <text x="437" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Deploy</text>
  <text x="437" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#93c5fd">test environment</text>

  <!-- Arrow: deploy test → deploy prod -->
  <line x1="492" y1="75" x2="506" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#cdp-arr)"/>

  <!-- Deploy Prod box -->
  <rect x="509" y="53" width="108" height="44" rx="5" fill="#1e3a5f"/>
  <text x="563" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Deploy</text>
  <text x="563" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#93c5fd">production</text>

  <!-- Arrow: deploy prod → live -->
  <line x1="618" y1="75" x2="636" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#cdp-arr)"/>

  <!-- Live circle -->
  <circle cx="654" cy="75" r="18" fill="#16a34a"/>
  <text x="654" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">✓</text>
  <text x="654" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#166534">Live</text>

  <!-- ════════════════════════════════════════
       POST-DEPLOY LANE  (y 138–234)
  ════════════════════════════════════════ -->

  <!-- Dashed down arrow: Deploy Test → E2E box -->
  <line x1="437" y1="98" x2="437" y2="148" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#cdp-arr-down)"/>

  <!-- Dashed down arrow: Deploy Prod → Monitor box -->
  <line x1="563" y1="98" x2="563" y2="148" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#cdp-arr-down)"/>

  <!-- E2E Smoke Tests box (under Deploy Test) -->
  <rect x="375" y="150" width="124" height="52" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="437" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">E2E Smoke Tests</text>
  <text x="437" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">non-deterministic</text>
  <text x="437" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">triggers rollback</text>

  <!-- E2E + Synthetic Monitoring box (under Deploy Prod) -->
  <rect x="501" y="150" width="124" height="52" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="563" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">E2E + Monitoring</text>
  <text x="563" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">non-deterministic</text>
  <text x="563" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#92400e">triggers alerts / rollback</text>

  <!-- Post-deploy description text -->
  <text x="375" y="218" font-family="system-ui,sans-serif" font-size="8" font-style="italic" fill="#b45309">triggered after deploy · never blocks promotion</text>

  <!-- ════════════════════════════════════════
       ASYNC LANE  (y 234–312)
  ════════════════════════════════════════ -->

  <!-- Contract tests spanning box (dashed border = not in main flow) -->
  <rect x="30" y="245" width="740" height="52" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="267" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e293b">Contract Tests</text>
  <text x="400" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#475569">Runs on schedule or triggered by contract change   ·   non-deterministic   ·   failures trigger review, not pipeline block</text>
  <!-- clock icon hint -->
  <text x="48" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">⏱</text>

  <!-- ════════════════════════════════════════
       CONTINUOUS LANE  (y 312–390)
  ════════════════════════════════════════ -->

  <!-- Exploratory Testing box -->
  <rect x="30" y="322" width="364" height="52" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="212" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Exploratory Testing</text>
  <text x="212" y="357" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">unscripted investigation   ·   never blocks   ·   continuous</text>

  <!-- Usability Testing box -->
  <rect x="406" y="322" width="364" height="52" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="588" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#4c1d95">Usability Testing</text>
  <text x="588" y="357" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6d28d9">real user validation   ·   never blocks   ·   informs product decisions</text>
</svg>
