baseURL     = "https://beyond.minimumcd.org/"
description = "MinimumCD Practice Guide - a phased migration from quarterly releases to continuous delivery"
title       = "MinimumCD Practice Guide"

enableGitInfo = false

[services.googleAnalytics]
  enableRobotsTXT = true
  id              = "G-KVLFMQXEF1"

  disableKinds = []

[sitemap]
  changeFreq = "monthly"
  priority   = 0.5

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.LLMS]
  baseName       = "llms"
  isPlainText    = true
  mediaType      = "text/plain"
  notAlternative = true

[outputFormats.LLMSFull]
  baseName       = "llms-full"
  isPlainText    = true
  mediaType      = "text/plain"
  notAlternative = true

[outputFormats.Markdown]
  baseName       = "index.html"
  isPlainText    = true
  mediaType      = "text/markdown"
  notAlternative = true

[taxonomies]
  category = "categories"
  tag      = "tags"

[permalinks]
  blog = "/:section/:year/:month/:day/:slug/"

[imaging]
  anchor         = "Smart"
  quality        = 75
  resampleFilter = "CatmullRom"

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "tango"

[outputs]
  home = [
    "HTML",
    "LLMS",
    "LLMSFull",
    "RSS"
  ]
  page = [
    "HTML",
    "Markdown"
  ]
  section = [
    "HTML",
    "Markdown",
    "RSS",
    "print"
  ]

[[module.mounts]]
  source = "content/en"
  target = "content"

[languages.en]
  languageName = "English"

  [languages.en.params]
    description = "MinimumCD Practice Guide - a phased migration from quarterly releases to continuous delivery"
    title       = "MinimumCD Practice Guide"

[params]
  github_branch = "main"
  github_repo = "https://github.com/bdfinst/cd-migration"
  images = [
    "/images/minimumCD-Tagline.png"
  ]

  offlineSearch = false

  prism_syntax_highlighting = true
  pygmentsCodeFences        = true
  pygmentsStyle             = "tango"
  pygmentsUseClasses        = false
  pygmentsUseClassic        = false

  [params.taxonomy]
    taxonomyCloud = [
      "categories",
      "tags"
    ]
    taxonomyCloudTitle = [
      "Categories",
      "Tag Cloud"
    ]
    taxonomyPageHeader = [
      "categories",
      "tags"
    ]

  [params.copyright]
    authors   = "[MinimumCD.org](https://minimumcd.org) & [DojoConsortium.org](https://dojoconsortium.org) | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0) | "
    from_year = 2025

  [params.ui]
    breadcrumb_disable                    = false
    navbar_logo                           = true
    navbar_translucent_over_cover_disable = true
    show_nav_title                        = true
    sidebar_cache_limit                   = 10
    sidebar_menu_compact                  = false
    sidebar_menu_foldable                 = true
    sidebar_search_disable                = true

    [params.ui.feedback]
      enable = false

    [params.ui.readingtime]
      enable = true

  [params.links]
    [[params.links.developer]]
      desc = "Report a defect or suggest an improvement"
      icon = "fab fa-github"
      name = "GitHub"
      url  = "https://github.com/bdfinst/cd-migration"

    [[params.links.developer]]
      desc = "Support the project"
      icon = "fas fa-mug-hot"
      name = "Support this project"
      url  = "https://ko-fi.com/bryanfinster"

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min      = "0.73.0"
  [[module.imports]]
    path = "github.com/google/docsy"
