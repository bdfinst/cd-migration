<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390"
     role="img" aria-labelledby="tald-title tald-desc"
     font-family="system-ui, -apple-system, sans-serif" font-size="13">

  <title id="tald-title">Before and After: Test Automation Workflow</title>
  <desc id="tald-desc">
    Before (top row, left to right): Dev codes story, then QA tests manually, then
    automation is written post-QA, then the automation backlog grows. Entirely sequential,
    automation always lags behind development.
    After (bottom): main delivery path flows left to right: Dev codes story and writes
    tests, then the pipeline runs all tests, then the story ships with coverage. Running
    concurrently alongside development and pipeline, not as a blocking step: QA exploratory
    testing. Tests are built in from the start with no lag.
  </desc>

  <rect width="720" height="390" fill="#fafafa" rx="4"/>

  <defs>
    <marker id="tald-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#224968"/>
    </marker>
    <marker id="tald-arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a63123"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="17"
        font-weight="bold" fill="#1a2a3a">Test Automation Workflow</text>

  <!-- ===== BEFORE ROW ===== -->
  <!-- 4 nodes x 160px, 15px gaps, 20px left margin -->

  <text x="20" y="58" font-size="12" font-weight="700" fill="#a63123">Before</text>

  <!-- n1: Dev codes story (x=20, cx=100) -->
  <rect x="20" y="66" width="160" height="52" rx="4" fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="100" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Dev codes story</text>

  <!-- arrow 1->2 -->
  <line x1="180" y1="92" x2="193" y2="92" stroke="#a63123" stroke-width="2" marker-end="url(#tald-arr-r)"/>

  <!-- n2: QA tests manually (x=195, cx=275) -->
  <rect x="195" y="66" width="160" height="52" rx="4" fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="275" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">QA tests manually</text>

  <!-- arrow 2->3 -->
  <line x1="355" y1="92" x2="368" y2="92" stroke="#a63123" stroke-width="2" marker-end="url(#tald-arr-r)"/>

  <!-- n3: Automation written post-QA (x=370, cx=450) - 2 lines -->
  <rect x="370" y="66" width="160" height="52" rx="4" fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="450" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Automation</text>
  <text x="450" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">written post-QA</text>

  <!-- arrow 3->4 -->
  <line x1="530" y1="92" x2="543" y2="92" stroke="#a63123" stroke-width="2" marker-end="url(#tald-arr-r)"/>

  <!-- n4: Automation backlog grows (x=545, cx=625) - 2 lines -->
  <rect x="545" y="66" width="160" height="52" rx="4" fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="625" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Automation</text>
  <text x="625" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">backlog grows</text>

  <!-- Before caption -->
  <text x="360" y="136" text-anchor="middle" font-size="11"
        font-style="italic" fill="#556">Sequential - automation always lags behind development</text>

  <!-- Section divider -->
  <line x1="20" y1="152" x2="700" y2="152" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ===== AFTER SECTION ===== -->

  <text x="20" y="172" font-size="12" font-weight="700" fill="#0d7a32">After</text>

  <!-- === MAIN DELIVERY PATH === -->
  <!-- 3 nodes x 180px, 30px gaps, 60px left margin -->

  <!-- n1: Dev codes + writes tests (x=60, cx=150) - 2 lines -->
  <rect x="60" y="182" width="180" height="52" rx="4" fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="150" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Dev codes story</text>
  <text x="150" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+ writes tests</text>

  <!-- arrow 1->2 -->
  <line x1="240" y1="208" x2="268" y2="208" stroke="#224968" stroke-width="2" marker-end="url(#tald-arr)"/>

  <!-- n2: Pipeline runs all tests (x=270, cx=360) - 2 lines -->
  <rect x="270" y="182" width="180" height="52" rx="4" fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="360" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Pipeline: all tests</text>
  <text x="360" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">pass</text>

  <!-- arrow 2->3 -->
  <line x1="450" y1="208" x2="478" y2="208" stroke="#224968" stroke-width="2" marker-end="url(#tald-arr)"/>

  <!-- n3: Story ships with coverage (x=480, cx=570) - 2 lines -->
  <rect x="480" y="182" width="180" height="52" rx="4" fill="#0d7a32" stroke="#0a6128" stroke-width="1"/>
  <text x="570" y="204" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Story ships</text>
  <text x="570" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">with coverage</text>

  <!-- === PARALLEL PROCESS: EXPLORATORY TESTING === -->

  <!-- Bracket connecting parallel box to the delivery path above it -->
  <path d="M 60 234 L 60 252 L 455 252 L 455 234"
        fill="none" stroke="#30648e" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Parallel label -->
  <text x="10" y="279" text-anchor="middle" font-size="9" fill="#30648e"
        transform="rotate(-90, 10, 279)">concurrent</text>

  <!-- Exploratory testing band (steel) -->
  <rect x="60" y="254" width="395" height="48" rx="4" fill="#30648e" stroke="#224968" stroke-width="1"/>
  <text x="257" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">QA: Exploratory Testing</text>
  <text x="257" y="291" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Ongoing. Not a gate for delivery.</text>

  <!-- After caption -->
  <text x="360" y="322" text-anchor="middle" font-size="11"
        font-style="italic" fill="#556">Tests built in from the start. Pipeline is the gate. Exploration never blocks.</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="358" width="12" height="12" rx="2" fill="#224968" stroke="#1a3a54" stroke-width="1"/>
  <text x="46" y="368" font-size="11" fill="#556">Development / pipeline</text>

  <rect x="210" y="358" width="12" height="12" rx="2" fill="#a63123" stroke="#8a2518" stroke-width="1"/>
  <text x="226" y="368" font-size="11" fill="#556">Problem state</text>

  <rect x="345" y="358" width="12" height="12" rx="2" fill="#30648e" stroke="#224968" stroke-width="1"/>
  <text x="361" y="368" font-size="11" fill="#556">QA / verification</text>

  <rect x="490" y="358" width="12" height="12" rx="2" fill="#0d7a32" stroke="#0a6128" stroke-width="1"/>
  <text x="506" y="368" font-size="11" fill="#556">Positive outcome</text>

</svg>
